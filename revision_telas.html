<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisión de Telas — Confecciones Millar</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:#f1f5f9;min-height:100vh;}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:1px solid #e2e8f0;
  box-shadow:0 1px 6px rgba(0,0,0,.07);padding:0 clamp(12px,2.5vw,24px);min-height:64px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;}
header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#1e3a8a,#2563eb,#60a5fa);}
.hd-left{display:flex;align-items:center;gap:12px;}
.hd-logo{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;
  justify-content:center;overflow:hidden;box-shadow:0 0 0 2px #e2e8f0,0 2px 8px rgba(0,0,0,.08);flex-shrink:0;}
.hd-logo img{width:100%;height:100%;object-fit:contain;padding:3px;}
.hd-title{font-family:'Barlow Condensed',sans-serif;font-size:clamp(14px,2vw,20px);
  font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#0f172a;line-height:1.1;}
.hd-title span{color:#2563eb;}
.hd-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.hd-back-btn{padding:6px 14px;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;
  color:#1e3a8a;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;
  letter-spacing:.5px;cursor:pointer;transition:all .2s;white-space:nowrap;}
.hd-back-btn:hover{background:#f1f5f9;border-color:#93c5fd;}

/* ── NAV ── */
.millar-nav{display:flex;align-items:center;gap:2px;}
.millar-nav-item{position:relative;}
.millar-nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 14px;
  border-radius:8px;border:none;background:transparent;cursor:pointer;transition:background .15s;min-width:60px;}
.millar-nav-btn:hover{background:#f1f5f9;}
.millar-nav-btn svg{flex-shrink:0;opacity:.65;}
.millar-nav-btn:hover svg{opacity:1;}
.millar-nav-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;color:#475569;white-space:nowrap;}
.millar-nav-btn:hover .millar-nav-label{color:#1e40af;}
.millar-dropdown{display:none;position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);
  min-width:200px;background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.1);z-index:9999;animation:dropIn .15s ease;}
@keyframes dropIn{from{opacity:0;transform:translateX(-50%) translateY(-6px);}
  to{opacity:1;transform:translateX(-50%) translateY(0);}}
.millar-dropdown.open{display:block;}
.millar-dd-inner{padding:6px;}
.millar-dd-item{display:flex;align-items:center;padding:9px 12px;border-radius:8px;
  font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.3px;
  color:#0f172a;cursor:pointer;transition:background .12s;text-decoration:none;white-space:nowrap;}
.millar-dd-item:hover{background:#f1f5f9;color:#1e40af;}
.millar-dd-sep{height:1px;background:#f1f5f9;margin:4px 6px;}
.millar-sub{display:none;position:absolute;left:100%;top:0;min-width:180px;background:#fff;
  border:1.5px solid #e2e8f0;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.1);padding:6px;}
.has-sub{position:relative;justify-content:space-between;}
.has-sub:hover .millar-sub{display:block;}
.millar-sub-item{display:block;padding:8px 12px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;
  font-size:13px;font-weight:700;color:#0f172a;text-decoration:none;transition:background .12s;}
.millar-sub-item:hover{background:#f1f5f9;color:#1e40af;}

/* ── MAIN ── */
.main{max-width:1400px;margin:0 auto;padding:24px clamp(12px,2.5vw,24px);}

/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.toolbar-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;
  letter-spacing:2px;text-transform:uppercase;color:#0f172a;margin-right:auto;}
.btn{padding:8px 16px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;font-size:13px;
  font-weight:700;letter-spacing:.5px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;border:none;}
.btn-primary{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;}
.btn-primary:hover{opacity:.9;}
.btn-success{background:#f0fdf4;color:#15803d;border:1.5px solid #86efac;}
.btn-success:hover{background:#dcfce7;}
.btn-cfg{background:#fffbeb;color:#b45309;border:1.5px solid #fcd34d;}
.btn-cfg:hover{background:#fef3c7;}
.btn-outline{background:#fff;color:#475569;border:1.5px solid #e2e8f0;}
.btn-outline:hover{background:#f8fafc;}

/* ── FILTROS ── */
.filters{background:#fff;border-radius:12px;border:1px solid #e2e8f0;padding:14px 18px;
  margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.filter-label{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;color:#64748b;}
.filter-input{padding:7px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;
  font-family:'Nunito',sans-serif;outline:none;color:#0f172a;background:#f8fafc;}
.filter-input:focus{border-color:#2563eb;background:#fff;}

/* ── STATS ── */
.stats-row{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.stat-card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 20px;
  display:flex;flex-direction:column;gap:4px;min-width:120px;}
.stat-num{font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;color:#0f172a;}
.stat-lbl{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:#94a3b8;}

/* ── TABLA ── */
.table-wrap{background:#fff;border-radius:12px;border:1px solid #e2e8f0;overflow:hidden;}
.table-header{display:grid;grid-template-columns:100px 1fr 80px 80px 100px 110px 140px 80px 80px 90px 90px;
  gap:0;padding:10px 16px;background:#f8fafc;border-bottom:1px solid #e2e8f0;}
.th{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:#64748b;display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;}
.th:hover{color:#1e40af;}
.th .sort-arrow{font-size:10px;color:#cbd5e1;}
.table-body{max-height:calc(100vh - 320px);overflow-y:auto;}
.table-row{display:grid;grid-template-columns:100px 1fr 80px 80px 100px 110px 140px 80px 80px 90px 90px;
  gap:0;padding:11px 16px;border-bottom:1px solid #f8fafc;transition:background .12s;align-items:center;}
.table-row:hover{background:#f8fafc;}
.td{font-size:12px;color:#334155;font-family:'Nunito',sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.td-badge{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:.3px;background:#eff6ff;color:#1d4ed8;}
.td-actions{display:flex;gap:4px;}
.btn-action{width:28px;height:28px;border-radius:6px;border:1.5px solid #e2e8f0;background:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .15s;}
.btn-action:hover{background:#f1f5f9;}
.btn-action.del:hover{background:#fef2f2;border-color:#fca5a5;}
.empty-state{padding:60px 20px;text-align:center;color:#94a3b8;}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-text{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}

/* ── MODALES ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1000;
  align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal-box{background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:90vh;
  overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);font-family:'Nunito',sans-serif;}
.modal-box.wide{max-width:720px;}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;background:#fff;z-index:1;}
.modal-title{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:800;
  letter-spacing:2px;color:#0f172a;}
.modal-body{padding:20px 24px;}
.modal-footer{padding:16px 24px;border-top:1px solid #e2e8f0;display:flex;gap:10px;justify-content:flex-end;
  position:sticky;bottom:0;background:#fff;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid.single{grid-template-columns:1fr;}
.form-field{display:flex;flex-direction:column;gap:5px;}
.form-field.full{grid-column:1/-1;}
.field-label{font-size:11px;font-weight:700;color:#64748b;letter-spacing:1px;text-transform:uppercase;}
.field-input,.field-select{padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;
  font-size:13px;font-family:'Nunito',sans-serif;outline:none;color:#0f172a;width:100%;background:#fff;}
.field-input:focus,.field-select:focus{border-color:#2563eb;}
.field-error{color:#dc2626;font-size:11px;min-height:14px;}

/* ── SEARCHABLE SELECT ── */
.searchable-wrap{position:relative;}
.searchable-input{width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;
  font-size:13px;font-family:'Nunito',sans-serif;outline:none;color:#0f172a;}
.searchable-input:focus{border-color:#2563eb;}
.searchable-dropdown{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;
  border:1.5px solid #e2e8f0;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.1);
  z-index:100;max-height:180px;overflow-y:auto;}
.searchable-dropdown.open{display:block;}
.searchable-option{padding:8px 12px;font-size:13px;cursor:pointer;font-family:'Nunito',sans-serif;color:#0f172a;}
.searchable-option:hover,.searchable-option.selected{background:#eff6ff;color:#1d4ed8;}
.searchable-empty{padding:12px;font-size:12px;color:#94a3b8;text-align:center;}

/* ── CFG MODAL ── */
.cfg-tabs{display:flex;gap:4px;background:#f8fafc;border-radius:8px;padding:4px;margin-bottom:16px;}
.cfg-tab{flex:1;padding:7px;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-size:12px;
  font-weight:700;letter-spacing:.5px;text-transform:uppercase;border:none;background:transparent;
  color:#64748b;cursor:pointer;transition:all .15s;}
.cfg-tab.active{background:#fff;color:#1e3a8a;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.cfg-list{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow-y:auto;}
.cfg-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;
  background:#f8fafc;border:1px solid #e2e8f0;}
.cfg-item-name{flex:1;font-size:13px;font-weight:600;color:#0f172a;}
.cfg-item-btn{width:28px;height:28px;border-radius:6px;border:1.5px solid #e2e8f0;background:#fff;
  cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.cfg-item-btn:hover{background:#fef2f2;border-color:#fca5a5;}
.cfg-add-row{display:flex;gap:8px;margin-top:10px;}
.cfg-add-input{flex:1;padding:8px 12px;border:1.5px solid #e2e8f0;border-radius:8px;
  font-size:13px;font-family:'Nunito',sans-serif;outline:none;}
.cfg-add-input:focus{border-color:#2563eb;}
.cfg-toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}

/* ── CONFIRM DELETE ── */
#modal-confirm-rt{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);
  z-index:1100;align-items:center;justify-content:center;}
#modal-confirm-rt.open{display:flex;}

/* ── TIEMPO ── */
.tiempo-badge{display:inline-flex;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;
  background:#f0fdf4;color:#15803d;border:1px solid #86efac;}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;background:#0f172a;color:#fff;padding:12px 20px;
  border-radius:10px;font-size:13px;font-weight:600;z-index:9999;transform:translateY(80px);
  opacity:0;transition:all .3s;pointer-events:none;}
.toast.show{transform:translateY(0);opacity:1;}
</style>
</head>
<body>

<header>
  <div class="hd-left">
    <div class="hd-logo">
      <img src="/logo.png" alt="Millar" onerror="this.style.display='none'">
    </div>
    <div>
      <div class="hd-title">Revisión <span>Telas</span></div>
      <p style="font-size:11px;color:#64748b;font-weight:600;margin-top:1px;" id="rt-date"></p>
    </div>
  </div>
  <div class="hd-right">
    <div data-millar-nav></div>
    <div style="width:1px;height:22px;background:#e2e8f0;flex-shrink:0;"></div>
    <button class="btn btn-cfg" onclick="openCfgModal()">⚙️ Configuraciones</button>
    <button class="btn btn-success" onclick="exportarExcel()">📊 Exportar Excel</button>
    <button class="btn btn-primary" onclick="openRegistroModal()">+ Nuevo Registro</button>
    <button class="hd-back-btn" onclick="location.href='/'">← Inicio</button>
  </div>
</header>

<div class="main">
  <!-- Stats -->
  <div class="stats-row" id="rt-stats"></div>

  <!-- Filtros -->
  <div class="filters">
    <span class="filter-label">📅 Filtrar por fecha:</span>
    <input type="date" class="filter-input" id="filtro-desde" onchange="aplicarFiltros()">
    <span class="filter-label" style="color:#94a3b8;">—</span>
    <input type="date" class="filter-input" id="filtro-hasta" onchange="aplicarFiltros()">
    <button class="btn btn-outline" onclick="limpiarFiltros()" style="padding:6px 12px;">✕ Limpiar</button>
  </div>

  <!-- Tabla -->
  <div class="table-wrap">
    <div class="table-header">
      <div class="th" onclick="sortBy('fecha')">Fecha <span class="sort-arrow">↕</span></div>
      <div class="th" onclick="sortBy('referencia')">Ref. Tela <span class="sort-arrow">↕</span></div>
      <div class="th"># Rollo</div>
      <div class="th">Color</div>
      <div class="th">Metros</div>
      <div class="th">Cant. Defectos</div>
      <div class="th">Tipo Defecto</div>
      <div class="th">H. Inicio</div>
      <div class="th">H. Fin</div>
      <div class="th">Tiempo</div>
      <div class="th">Acciones</div>
    </div>
    <div class="table-body" id="rt-table-body"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="rt-toast"></div>

<!-- Modal Nuevo/Editar Registro -->
<div class="modal-overlay" id="modal-registro" onclick="if(event.target===this)closeRegistroModal()">
  <div class="modal-box wide">
    <div class="modal-header">
      <div class="modal-title" id="registro-modal-title">➕ NUEVO REGISTRO</div>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-field">
          <label class="field-label">Fecha</label>
          <input type="date" class="field-input" id="f-fecha">
        </div>
        <div class="form-field">
          <label class="field-label">Referencia Tela</label>
          <div class="searchable-wrap">
            <input type="text" class="searchable-input" id="f-ref-input" placeholder="Buscar referencia..." autocomplete="off"
              oninput="filtrarOpciones('f-ref-input','f-ref-dd','_cfgReferencias')" onfocus="abrirDropdown('f-ref-dd')" onblur="setTimeout(()=>cerrarDropdown('f-ref-dd'),200)">
            <input type="hidden" id="f-ref-val">
            <div class="searchable-dropdown" id="f-ref-dd"></div>
          </div>
        </div>
        <div class="form-field">
          <label class="field-label"># de Rollo</label>
          <input type="number" min="0" class="field-input" id="f-rollo" placeholder="Ej: 001">
        </div>
        <div class="form-field">
          <label class="field-label">Color</label>
          <select class="field-select" id="f-color">
            <option value="">— Seleccionar —</option>
          </select>
        </div>
        <div class="form-field">
          <label class="field-label">Metros Revisados</label>
          <input type="number" min="0" step="0.1" class="field-input" id="f-metros" placeholder="Ej: 25.5">
        </div>
        <div class="form-field">
          <label class="field-label">Cantidad Defectos</label>
          <input type="number" min="0" class="field-input" id="f-defectos" placeholder="Ej: 3">
        </div>
        <div class="form-field full">
          <label class="field-label">Tipo Defecto</label>
          <select class="field-select" id="f-tipo-defecto">
            <option value="">— Seleccionar —</option>
          </select>
        </div>
        <div class="form-field">
          <label class="field-label">Hora Inicio</label>
          <div style="display:flex;gap:6px;align-items:center;">
            <input type="number" min="1" max="12" class="field-input" id="f-hi-h" placeholder="HH" style="width:60px;text-align:center;">
            <span style="color:#64748b;font-weight:700;">:</span>
            <input type="number" min="0" max="59" class="field-input" id="f-hi-m" placeholder="MM" style="width:60px;text-align:center;">
            <select class="field-select" id="f-hi-ampm" style="width:70px;">
              <option value="AM">AM</option>
              <option value="PM">PM</option>
            </select>
          </div>
        </div>
        <div class="form-field">
          <label class="field-label">Hora Fin</label>
          <div style="display:flex;gap:6px;align-items:center;">
            <input type="number" min="1" max="12" class="field-input" id="f-hf-h" placeholder="HH" style="width:60px;text-align:center;" oninput="calcularTiempo()">
            <span style="color:#64748b;font-weight:700;">:</span>
            <input type="number" min="0" max="59" class="field-input" id="f-hf-m" placeholder="MM" style="width:60px;text-align:center;" oninput="calcularTiempo()">
            <select class="field-select" id="f-hf-ampm" style="width:70px;" onchange="calcularTiempo()">
              <option value="AM">AM</option>
              <option value="PM">PM</option>
            </select>
          </div>
        </div>
        <div class="form-field full">
          <label class="field-label">Tiempo Tardado</label>
          <div id="f-tiempo-preview" style="padding:9px 14px;background:#f0fdf4;border-radius:8px;
            border:1.5px solid #86efac;font-weight:700;color:#15803d;font-size:14px;min-height:40px;">
            — Se calcula automáticamente —
          </div>
        </div>
      </div>
      <div id="f-error" style="color:#dc2626;font-size:12px;margin-top:8px;min-height:14px;"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeRegistroModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarRegistro()">💾 Guardar</button>
    </div>
  </div>
</div>

<!-- Modal Configuraciones -->
<div class="modal-overlay" id="modal-cfg" onclick="if(event.target===this)closeCfgModal()">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">⚙️ CONFIGURACIONES</div>
    </div>
    <div class="modal-body">
      <div class="cfg-tabs">
        <button class="cfg-tab active" onclick="switchCfgTab('defectos',this)">Tipos Defecto</button>
        <button class="cfg-tab" onclick="switchCfgTab('referencias',this)">Referencias Tela</button>
        <button class="cfg-tab" onclick="switchCfgTab('colores',this)">Colores</button>
      </div>
      <div id="cfg-tab-content"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeCfgModal()">Cerrar</button>
    </div>
  </div>
</div>

<!-- Modal Confirmar Eliminar con contraseña -->
<div id="modal-confirm-rt" onclick="if(event.target===this)closeConfirmRT()">
  <div style="background:#fff;border-radius:16px;padding:24px;width:100%;max-width:380px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);font-family:'Nunito',sans-serif;">
    <div id="rt-confirm-title" style="font-family:'Barlow Condensed',sans-serif;font-size:19px;
      font-weight:800;letter-spacing:2px;color:#dc2626;margin-bottom:8px;">⚠️ CONFIRMAR</div>
    <p id="rt-confirm-sub" style="font-size:13px;color:#475569;margin-bottom:16px;"></p>
    <label style="font-size:11px;font-weight:700;color:#64748b;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:6px;">Contraseña</label>
    <input type="password" id="rt-confirm-pass" placeholder="····" maxlength="20"
      style="width:100%;padding:9px 12px;border-radius:8px;border:1.5px solid #e2e8f0;
      font-size:14px;outline:none;margin-bottom:6px;"
      onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#e2e8f0'"
      onkeydown="if(event.key==='Enter')executeConfirmRT()">
    <div id="rt-confirm-error" style="color:#dc2626;font-size:12px;min-height:16px;margin-bottom:12px;"></div>
    <div style="display:flex;gap:10px;">
      <button onclick="closeConfirmRT()" style="flex:1;padding:10px;border-radius:8px;border:1.5px solid #e2e8f0;
        background:#fff;color:#64748b;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;">Cancelar</button>
      <button onclick="executeConfirmRT()" style="flex:1;padding:10px;border-radius:8px;border:none;
        background:#dc2626;color:#fff;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;cursor:pointer;">Confirmar</button>
    </div>
  </div>
</div>

<script>
// ── Estado global ──────────────────────────────────────────────────
let _registros  = [];
let _filtrados  = [];
let _sortCol    = 'fecha';
let _sortDir    = -1;
let _editingId  = null;
let _confirmCB  = null;
let _cfgTab     = 'defectos';
let _cfgDefectos    = [];
let _cfgReferencias = [];
let _cfgColores     = [];
let ws = null, wsReady = false, wsTimer = null;

// ── WebSocket ──────────────────────────────────────────────────────
function connectWS(){
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host);
  ws.onopen = () => { wsReady = true; clearTimeout(wsTimer); };
  ws.onmessage = e => {
    try{
      const msg = JSON.parse(e.data);
      if(msg.type === 'rt_update'){
        _registros = msg.registros || [];
        _cfgDefectos    = msg.defectos    || _cfgDefectos;
        _cfgReferencias = msg.referencias || _cfgReferencias;
        _cfgColores     = msg.colores     || _cfgColores;
        aplicarFiltros();
      }
    }catch(err){ console.warn('WS:',err); }
  };
  ws.onclose = () => { wsReady = false; wsTimer = setTimeout(connectWS, 4000); };
  ws.onerror = () => ws.close();
}

// ── API ────────────────────────────────────────────────────────────
async function cargarDatos(){
  try{
    const res = await fetch('/api/revision-telas');
    if(res.ok){
      const data = await res.json();
      _registros      = data.registros    || [];
      _cfgDefectos    = data.defectos     || [];
      _cfgReferencias = data.referencias  || [];
      _cfgColores     = data.colores      || [];
    }
  }catch(e){ console.warn('cargarDatos:',e); }
  aplicarFiltros();
  renderStats();
}

async function guardarEnServidor(){
  try{
    await fetch('/api/revision-telas', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ registros: _registros, defectos: _cfgDefectos,
        referencias: _cfgReferencias, colores: _cfgColores })
    });
  }catch(e){ console.warn('guardar:',e); }
}

// ── Fecha y encabezado ─────────────────────────────────────────────
document.getElementById('rt-date').textContent =
  new Date().toLocaleDateString('es-CO',{weekday:'long',year:'numeric',month:'long',day:'numeric'});

// ── Filtros ────────────────────────────────────────────────────────
function aplicarFiltros(){
  const desde = document.getElementById('filtro-desde').value;
  const hasta = document.getElementById('filtro-hasta').value;
  _filtrados = _registros.filter(r => {
    if(desde && r.fecha < desde) return false;
    if(hasta && r.fecha > hasta) return false;
    return true;
  });
  _filtrados.sort((a,b) => {
    const va = a[_sortCol]||'', vb = b[_sortCol]||'';
    return _sortDir * (va > vb ? 1 : va < vb ? -1 : 0);
  });
  renderTabla();
  renderStats();
}

function limpiarFiltros(){
  document.getElementById('filtro-desde').value = '';
  document.getElementById('filtro-hasta').value = '';
  aplicarFiltros();
}

function sortBy(col){
  if(_sortCol === col) _sortDir *= -1;
  else { _sortCol = col; _sortDir = 1; }
  aplicarFiltros();
}

// ── Stats ──────────────────────────────────────────────────────────
function renderStats(){
  const total = _filtrados.length;
  const metros = _filtrados.reduce((s,r) => s + parseFloat(r.metros||0), 0);
  const defectos = _filtrados.reduce((s,r) => s + parseInt(r.cantidad_defectos||0), 0);
  document.getElementById('rt-stats').innerHTML = `
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-lbl">Registros</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#2563eb;">${metros.toFixed(1)}</div><div class="stat-lbl">Metros</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#dc2626;">${defectos}</div><div class="stat-lbl">Defectos</div></div>`;
}

// ── Tabla ──────────────────────────────────────────────────────────
function renderTabla(){
  const body = document.getElementById('rt-table-body');
  if(!_filtrados.length){
    body.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🧵</div>
      <div class="empty-text">No hay registros</div>
      <div style="font-size:12px;margin-top:6px;color:#cbd5e1;">Agrega el primer registro con el botón + Nuevo Registro</div>
    </div>`;
    return;
  }
  body.innerHTML = _filtrados.map(r => `
    <div class="table-row">
      <div class="td">${r.fecha||'—'}</div>
      <div class="td"><span class="td-badge">${r.referencia||'—'}</span></div>
      <div class="td">${r.rollo||'—'}</div>
      <div class="td">${r.color||'—'}</div>
      <div class="td">${r.metros||'—'}</div>
      <div class="td">${r.cantidad_defectos||'—'}</div>
      <div class="td">${r.tipo_defecto||'—'}</div>
      <div class="td">${r.hora_inicio||'—'}</div>
      <div class="td">${r.hora_fin||'—'}</div>
      <div class="td"><span class="tiempo-badge">${r.tiempo||'—'}</span></div>
      <div class="td td-actions">
        <button class="btn-action" title="Editar" onclick="editarRegistro('${r.id}')">✏️</button>
        <button class="btn-action del" title="Eliminar" onclick="confirmarEliminar('${r.id}')">🗑</button>
      </div>
    </div>`).join('');
}

// ── Modal Registro ─────────────────────────────────────────────────
function openRegistroModal(id){
  _editingId = id || null;
  const modal = document.getElementById('modal-registro');
  const title = document.getElementById('registro-modal-title');
  title.textContent = id ? '✏️ EDITAR REGISTRO' : '➕ NUEVO REGISTRO';

  // Poblar selects
  poblarSelect('f-color', _cfgColores);
  poblarSelect('f-tipo-defecto', _cfgDefectos);
  poblarSearchable('f-ref-input','f-ref-dd','f-ref-val', _cfgReferencias);

  // Fecha por defecto = hoy
  const hoy = new Date().toISOString().split('T')[0];

  if(id){
    const r = _registros.find(x => x.id === id);
    if(r){
      document.getElementById('f-fecha').value = r.fecha || hoy;
      document.getElementById('f-ref-input').value = r.referencia || '';
      document.getElementById('f-ref-val').value   = r.referencia || '';
      document.getElementById('f-rollo').value   = r.rollo || '';
      document.getElementById('f-color').value   = r.color || '';
      document.getElementById('f-metros').value  = r.metros || '';
      document.getElementById('f-defectos').value = r.cantidad_defectos || '';
      document.getElementById('f-tipo-defecto').value = r.tipo_defecto || '';
      // Hora inicio
      const hi = parseHora(r.hora_inicio);
      document.getElementById('f-hi-h').value    = hi.h;
      document.getElementById('f-hi-m').value    = hi.m;
      document.getElementById('f-hi-ampm').value = hi.ampm;
      // Hora fin
      const hf = parseHora(r.hora_fin);
      document.getElementById('f-hf-h').value    = hf.h;
      document.getElementById('f-hf-m').value    = hf.m;
      document.getElementById('f-hf-ampm').value = hf.ampm;
      document.getElementById('f-tiempo-preview').textContent = r.tiempo || '—';
    }
  } else {
    document.getElementById('f-fecha').value = hoy;
    document.getElementById('f-ref-input').value = '';
    document.getElementById('f-ref-val').value   = '';
    ['f-rollo','f-metros','f-defectos'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('f-color').value = '';
    document.getElementById('f-tipo-defecto').value = '';
    document.getElementById('f-hi-h').value = '';
    document.getElementById('f-hi-m').value = '';
    document.getElementById('f-hf-h').value = '';
    document.getElementById('f-hf-m').value = '';
    document.getElementById('f-hi-ampm').value = 'AM';
    document.getElementById('f-hf-ampm').value = 'AM';
    document.getElementById('f-tiempo-preview').textContent = '— Se calcula automáticamente —';
  }
  document.getElementById('f-error').textContent = '';
  modal.classList.add('open');
}

function closeRegistroModal(){
  document.getElementById('modal-registro').classList.remove('open');
}

function editarRegistro(id){
  openRegistroModal(id);
}

function guardarRegistro(){
  const fecha   = document.getElementById('f-fecha').value.trim();
  const ref     = document.getElementById('f-ref-val').value.trim() || document.getElementById('f-ref-input').value.trim();
  const rollo   = document.getElementById('f-rollo').value.trim();
  const color   = document.getElementById('f-color').value;
  const metros  = document.getElementById('f-metros').value.trim();
  const defQty  = document.getElementById('f-defectos').value.trim();
  const defTipo = document.getElementById('f-tipo-defecto').value;
  const hiH = document.getElementById('f-hi-h').value;
  const hiM = document.getElementById('f-hi-m').value.padStart(2,'0');
  const hiAP= document.getElementById('f-hi-ampm').value;
  const hfH = document.getElementById('f-hf-h').value;
  const hfM = document.getElementById('f-hf-m').value.padStart(2,'0');
  const hfAP= document.getElementById('f-hf-ampm').value;
  const errEl = document.getElementById('f-error');

  if(!fecha){ errEl.textContent='La fecha es obligatoria'; return; }
  if(!ref){   errEl.textContent='La referencia es obligatoria'; return; }

  const hora_inicio = hiH ? `${hiH}:${hiM} ${hiAP}` : '';
  const hora_fin    = hfH ? `${hfH}:${hfM} ${hfAP}` : '';
  const tiempo      = calcularTiempoStr(hora_inicio, hora_fin);

  const registro = { fecha, referencia: ref, rollo, color, metros, cantidad_defectos: defQty,
    tipo_defecto: defTipo, hora_inicio, hora_fin, tiempo };

  if(_editingId){
    const idx = _registros.findIndex(r => r.id === _editingId);
    if(idx >= 0) _registros[idx] = { ..._registros[idx], ...registro };
  } else {
    registro.id = 'rt_' + Date.now() + '_' + Math.random().toString(36).slice(2,6);
    _registros.push(registro);
  }

  guardarEnServidor();
  aplicarFiltros();
  closeRegistroModal();
  showToast(_editingId ? '✅ Registro actualizado' : '✅ Registro guardado');
}

// ── Cálculo de tiempo ──────────────────────────────────────────────
function parseHora(str){
  if(!str) return {h:'',m:'',ampm:'AM'};
  const m = str.match(/(\d+):(\d+)\s*(AM|PM)/i);
  if(!m) return {h:'',m:'',ampm:'AM'};
  return {h: m[1], m: m[2], ampm: m[3].toUpperCase()};
}

function to24(h, m, ampm){
  let hh = parseInt(h);
  const mm = parseInt(m);
  if(ampm === 'PM' && hh !== 12) hh += 12;
  if(ampm === 'AM' && hh === 12) hh = 0;
  return hh * 60 + mm;
}

function calcularTiempoStr(inicio, fin){
  if(!inicio || !fin) return '';
  const pi = parseHora(inicio), pf = parseHora(fin);
  if(!pi.h || !pf.h) return '';
  const mi = to24(pi.h, pi.m, pi.ampm);
  let mf = to24(pf.h, pf.m, pf.ampm);
  if(mf < mi) mf += 24 * 60; // pasa medianoche
  const diff = mf - mi;
  const hh = Math.floor(diff / 60);
  const mm = diff % 60;
  return hh > 0 ? `${hh}h ${mm}min` : `${mm}min`;
}

function calcularTiempo(){
  const hiH  = document.getElementById('f-hi-h').value;
  const hiM  = document.getElementById('f-hi-m').value.padStart(2,'0');
  const hiAP = document.getElementById('f-hi-ampm').value;
  const hfH  = document.getElementById('f-hf-h').value;
  const hfM  = document.getElementById('f-hf-m').value.padStart(2,'0');
  const hfAP = document.getElementById('f-hf-ampm').value;
  const inicio = hiH ? `${hiH}:${hiM} ${hiAP}` : '';
  const fin    = hfH ? `${hfH}:${hfM} ${hfAP}` : '';
  const t = calcularTiempoStr(inicio, fin);
  const el = document.getElementById('f-tiempo-preview');
  el.textContent = t || '— Se calcula automáticamente —';
}

// ── Searchable select ──────────────────────────────────────────────
function poblarSearchable(inputId, ddId, valId, lista){
  const dd = document.getElementById(ddId);
  dd.innerHTML = lista.map(item =>
    `<div class="searchable-option" onmousedown="seleccionarOpcion('${inputId}','${ddId}','${valId}','${item}')">${item}</div>`
  ).join('') || `<div class="searchable-empty">Sin opciones</div>`;
}

function filtrarOpciones(inputId, ddId, listaVar){
  const q = document.getElementById(inputId).value.toLowerCase();
  const lista = window[listaVar] || [];
  const dd = document.getElementById(ddId);
  const filtradas = lista.filter(i => i.toLowerCase().includes(q));
  dd.innerHTML = filtradas.map(item =>
    `<div class="searchable-option" onmousedown="seleccionarOpcion('${inputId}','${ddId}','${inputId.replace('-input','-val')}','${item}')">${item}</div>`
  ).join('') || `<div class="searchable-empty">Sin resultados</div>`;
  dd.classList.add('open');
}

function seleccionarOpcion(inputId, ddId, valId, val){
  document.getElementById(inputId).value = val;
  document.getElementById(valId).value   = val;
  cerrarDropdown(ddId);
}

function abrirDropdown(ddId){
  document.getElementById(ddId)?.classList.add('open');
}
function cerrarDropdown(ddId){
  document.getElementById(ddId)?.classList.remove('open');
}

function poblarSelect(selId, lista){
  const sel = document.getElementById(selId);
  const cur = sel.value;
  sel.innerHTML = '<option value="">— Seleccionar —</option>' +
    lista.map(i => `<option value="${i}">${i}</option>`).join('');
  sel.value = cur;
}

// ── Configuraciones ────────────────────────────────────────────────
let _cfgTabActual = 'defectos';

function openCfgModal(){
  switchCfgTab('defectos', document.querySelector('.cfg-tab'));
  document.getElementById('modal-cfg').classList.add('open');
}

function closeCfgModal(){
  document.getElementById('modal-cfg').classList.remove('open');
}

function getCfgLista(tab){
  if(tab==='defectos')   return _cfgDefectos;
  if(tab==='referencias')return _cfgReferencias;
  if(tab==='colores')    return _cfgColores;
  return [];
}
function setCfgLista(tab, lista){
  if(tab==='defectos')    _cfgDefectos    = lista;
  if(tab==='referencias') _cfgReferencias = lista;
  if(tab==='colores')     _cfgColores     = lista;
}

function switchCfgTab(tab, btn){
  _cfgTabActual = tab;
  document.querySelectorAll('.cfg-tab').forEach(b => b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  renderCfgTab(tab);
}

function renderCfgTab(tab){
  const lista = getCfgLista(tab);
  const nombres = {defectos:'Tipo de Defecto', referencias:'Referencia Tela', colores:'Color'};
  const body = document.getElementById('cfg-tab-content');
  body.innerHTML = `
    <div class="cfg-toolbar">
      <button class="btn btn-outline" style="font-size:12px;padding:6px 10px;" onclick="importarCfg('${tab}')">📥 Importar</button>
      <button class="btn btn-outline" style="font-size:12px;padding:6px 10px;" onclick="plantillaCfg('${tab}')">📄 Plantilla</button>
    </div>
    <div class="cfg-list" id="cfg-list-${tab}">
      ${lista.map((item, i) => `
        <div class="cfg-item" id="cfg-item-${tab}-${i}">
          <span class="cfg-item-name">${item}</span>
          <button class="cfg-item-btn" onclick="eliminarCfgItem('${tab}',${i})" title="Eliminar">🗑</button>
        </div>`).join('') || '<div style="padding:16px;text-align:center;color:#94a3b8;font-size:13px;">Sin items. Agrega el primero abajo.</div>'}
    </div>
    <div class="cfg-add-row">
      <input type="text" class="cfg-add-input" id="cfg-add-${tab}" placeholder="Nuevo ${nombres[tab]}..."
        onkeydown="if(event.key==='Enter')agregarCfgItem('${tab}')">
      <button class="btn btn-primary" style="padding:8px 14px;" onclick="agregarCfgItem('${tab}')">+ Agregar</button>
    </div>`;
}

function agregarCfgItem(tab){
  const inp = document.getElementById(`cfg-add-${tab}`);
  const val = inp.value.trim();
  if(!val) return;
  const lista = getCfgLista(tab);
  if(lista.includes(val)){ showToast('⚠️ Ya existe ese valor'); return; }
  lista.push(val);
  setCfgLista(tab, lista);
  inp.value = '';
  guardarEnServidor();
  renderCfgTab(tab);
  showToast('✅ Agregado');
}

function eliminarCfgItem(tab, idx){
  const lista = getCfgLista(tab);
  lista.splice(idx, 1);
  setCfgLista(tab, lista);
  guardarEnServidor();
  renderCfgTab(tab);
  showToast('🗑 Eliminado');
}

function importarCfg(tab){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.xlsx,.xls,.csv';
  inp.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try{
        const wb = XLSX.read(ev.target.result, {type:'binary'});
        const ws2 = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws2, {header:1});
        const lista = getCfgLista(tab);
        let added = 0;
        rows.forEach(row => {
          const val = (row[0]||'').toString().trim();
          if(val && !lista.includes(val)){ lista.push(val); added++; }
        });
        setCfgLista(tab, lista);
        guardarEnServidor();
        renderCfgTab(tab);
        showToast(`✅ ${added} items importados`);
      }catch(err){ alert('Error al leer el archivo: '+err.message); }
    };
    reader.readAsBinaryString(file);
  };
  inp.click();
}

function plantillaCfg(tab){
  const nombres = {defectos:'Tipo_Defecto', referencias:'Referencia_Tela', colores:'Color'};
  const ws2 = XLSX.utils.aoa_to_sheet([[nombres[tab]], ['Ejemplo 1'], ['Ejemplo 2']]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws2, 'Plantilla');
  XLSX.writeFile(wb, `plantilla_${tab}.xlsx`);
}

// ── Confirmar con contraseña ───────────────────────────────────────
function confirmarEliminar(id){
  const r = _registros.find(x => x.id === id);
  const sub = r ? `Fecha: ${r.fecha} — Ref: ${r.referencia}` : 'Este registro no se puede recuperar.';
  document.getElementById('rt-confirm-title').textContent = '⚠️ ELIMINAR REGISTRO';
  document.getElementById('rt-confirm-sub').textContent   = sub;
  document.getElementById('rt-confirm-pass').value = '';
  document.getElementById('rt-confirm-error').textContent = '';
  _confirmCB = () => {
    _registros = _registros.filter(x => x.id !== id);
    guardarEnServidor();
    aplicarFiltros();
    showToast('🗑 Registro eliminado');
  };
  document.getElementById('modal-confirm-rt').classList.add('open');
  setTimeout(() => document.getElementById('rt-confirm-pass').focus(), 100);
}

function closeConfirmRT(){
  document.getElementById('modal-confirm-rt').classList.remove('open');
  _confirmCB = null;
}

function executeConfirmRT(){
  const pass = document.getElementById('rt-confirm-pass').value;
  const errEl = document.getElementById('rt-confirm-error');
  if(pass !== '1'){ errEl.textContent = 'Contraseña incorrecta'; document.getElementById('rt-confirm-pass').value=''; document.getElementById('rt-confirm-pass').focus(); return; }
  closeConfirmRT();
  if(_confirmCB) _confirmCB();
}

// ── Exportar Excel ─────────────────────────────────────────────────
function exportarExcel(){
  if(!_filtrados.length){ showToast('⚠️ No hay registros para exportar'); return; }
  const data = _filtrados.map(r => ({
    'Fecha': r.fecha||'', 'Referencia Tela': r.referencia||'', '# Rollo': r.rollo||'',
    'Color': r.color||'', 'Metros Revisados': r.metros||'', 'Cantidad Defectos': r.cantidad_defectos||'',
    'Tipo Defecto': r.tipo_defecto||'', 'Hora Inicio': r.hora_inicio||'',
    'Hora Fin': r.hora_fin||'', 'Tiempo Tardado': r.tiempo||''
  }));
  const ws2 = XLSX.utils.json_to_sheet(data);
  ws2['!cols'] = [8,16,8,10,10,12,16,10,10,10].map(w=>({wch:w}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws2, 'Revisión Telas');
  XLSX.writeFile(wb, `revision_telas_${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('📊 Excel exportado');
}

// ── Toast ──────────────────────────────────────────────────────────
let _toastTimer = null;
function showToast(msg){
  const t = document.getElementById('rt-toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Init ───────────────────────────────────────────────────────────
cargarDatos();
connectWS();
</script>

<!-- Nav Millar -->
<script>
(function(){

              sessionStorage.getItem('millar_nav_perfil') || '';
    return p.toLowerCase();
  }
  const RUTAS = {

    recogedores:'/recogedores', tableroGeneral:'/?tablero=general',

    insumos:'/solicitar-insumos', alistamiento:'/alistamiento?seccion=alistamiento',
    mantenimiento:'/alistamiento?seccion=mantenimiento', contador:'/contador-modulos',
    informeCI:'/ci?seccion=informe', informeGeneral:'/?seccion=historico',
    dashCI:'/ci?seccion=dashboard',
  };
  function ir(ruta){
    const p=getNavPerfil(), sep=ruta.includes('?')?'&':'?';
    location.href=p?ruta+sep+'perfil='+encodeURIComponent(p):ruta;
  }
  const PERMISOS={
    programador:['produccion','tableros','mecanicos','modulos','informes'],
    administrador:['produccion','tableros','mecanicos','modulos','informes'],
    supervisora:['asistencia'], mecanicos:['tableroMec','insumos','montajes'],
    televisor:['tableroGeneral','tableroMec','tableroCI'], recogedores:['recogedores'],
  };
  const ICONS={
    produccion:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>',
    tableros:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
    mecanicos:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>',
    modulos:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
    informes:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>',
  };
  const FLECHA='<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4.5 3l3 3-3 3"/></svg>';
  function buildNav(){
    const perfil=getNavPerfil();
    const esAdmin=!perfil||['programador','administrador'].includes(perfil);
    const esMec=perfil==='mecanicos', esTV=perfil==='televisor';
    const esSup=perfil==='supervisora', esRec=perfil==='recogedores';
    function href(r){const p=getNavPerfil(),s=r.includes('?')?'&':'?';return p?r+s+'perfil='+encodeURIComponent(p):r;}
    let html='<div class="millar-nav" id="millar-nav">';
    const prodItems=[];
    if(esAdmin) prodItems.push(`<a class="millar-dd-item" href="${href(RUTAS.produccion)}">🗂 Tablero Producción</a>`);
    if(esAdmin) prodItems.push(`<a class="millar-dd-item" href="${href(RUTAS.ordenes)}">📋 Órdenes</a>`);
    if(esAdmin||esSup) prodItems.push(`<a class="millar-dd-item" href="${href(RUTAS.asistencia)}">⏱ Control Asistencia</a>`);
    if(esAdmin||esRec) prodItems.push(`<a class="millar-dd-item" href="${href(RUTAS.recogedores)}">🧺 Conteo Recogedores</a>`);
    if(prodItems.length) html+=buildBtn('produccion','Producción',prodItems);
    const tabItems=[];
    if(esAdmin||esTV) tabItems.push(`<a class="millar-dd-item" href="${href(RUTAS.tableroGeneral)}">🏭 Tablero General</a>`);
    if(esAdmin||esTV||esMec) tabItems.push(`<a class="millar-dd-item" href="${href(RUTAS.tableroMec)}">🔧 Tablero Mecánicos</a>`);
    if(esAdmin||esTV) tabItems.push(`<a class="millar-dd-item" href="${href(RUTAS.tableroCI)}">📦 Tablero CI</a>`);
    if(tabItems.length) html+=buildBtn('tableros','Tableros',tabItems);
    const mecItems=[];
    if(esAdmin||esMec) mecItems.push(`<a class="millar-dd-item" href="${href(RUTAS.insumos)}">📦 Solicitar Insumos</a>`);
    if(mecItems.length) html+=buildBtn('mecanicos','Mecánicos',mecItems);
    if(esAdmin) html+=buildBtn('modulos','Módulos',[`<a class="millar-dd-item" href="${href(RUTAS.contador)}">🟢 Contador Módulos</a>`]);
    if(esAdmin) html+=buildBtn('informes','Informes',[
      `<a class="millar-dd-item" href="${href(RUTAS.informeGeneral)}">📊 Informe General</a>`,
      `<a class="millar-dd-item" href="${href(RUTAS.informeCI)}">📋 Informe CI</a>`,
      `<a class="millar-dd-item" href="${href(RUTAS.dashCI)}">📈 Dashboard CI</a>`,
    ]);
    html+='</div>';
    return html;
  }
  function buildBtn(key,label,items){
    const ddId='millar-dd-'+key;
    return `<div class="millar-nav-item"><button class="millar-nav-btn" onclick="millarNavToggle('${ddId}')">${ICONS[key]||''}<span class="millar-nav-label">${label}</span></button><div class="millar-dropdown" id="${ddId}"><div class="millar-dd-inner">${items.join('')}</div></div></div>`;
  }
  window.millarNavToggle=function(id){
    document.querySelectorAll('.millar-dropdown').forEach(d=>{if(d.id!==id)d.classList.remove('open');});
    document.getElementById(id)?.classList.toggle('open');
  };
  document.addEventListener('click',function(e){
    if(!e.target.closest('.millar-nav-item')) document.querySelectorAll('.millar-dropdown').forEach(d=>d.classList.remove('open'));
  });
  window.ir=ir;
  function inject(){
    document.querySelectorAll('[data-millar-nav]').forEach(el=>{el.innerHTML=buildNav();});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',inject);
  else inject();
})();
</script>
</body>
</html>
