<style>
*{ box-sizing:border-box; margin:0; padding:0; }
body{ background:#f1f5f9; font-family:'Nunito',sans-serif; color:#0f172a; min-height:100vh; overflow-x:hidden; }
input,select,textarea{ font-size:16px !important; }
:root{
  --accent:#2563eb; --accent2:#1e3a8a; --text:#0f172a;
  --muted:#64748b; --border:#e2e8f0; --surface:#fff;
  --ok:#16a34a; --danger:#ef4444; --warn:#f59e0b;
}

/* ── HEADER ── */
header{
  position:sticky;top:0;z-index:100;
  background:#fff;border-bottom:1px solid var(--border);
  box-shadow:0 1px 6px rgba(0,0,0,.07);
  padding:0 clamp(12px,2.5vw,24px);min-height:64px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
header::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#1e3a8a,#2563eb,#60a5fa);
}
.hd-left{ display:flex;align-items:center;gap:12px; }
.hd-logo{
  width:36px;height:36px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:0 0 0 2px #e2e8f0,0 2px 8px rgba(0,0,0,.08);flex-shrink:0;
}
.hd-logo img{ width:100%;height:100%;object-fit:contain;padding:3px; }
.hd-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:clamp(16px,2.5vw,22px);font-weight:800;
  letter-spacing:2px;text-transform:uppercase;color:#0f172a;line-height:1.1;
}
.hd-title span{ color:var(--accent); }
.hd-right{ display:flex;align-items:center;gap:8px; }

/* ── BOTONES ── */
.btn{
  padding:7px 16px;border-radius:8px;border:1.5px solid var(--border);
  background:#fff;color:var(--accent2);font-family:'Barlow Condensed',sans-serif;
  font-size:13px;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.btn:hover{ background:#f1f5f9; }
.btn.primary{ background:var(--accent);color:#fff;border-color:var(--accent); }
.btn.primary:hover{ filter:brightness(1.1); }
.btn.success{ background:var(--ok);color:#fff;border-color:var(--ok); }
.btn.success:hover{ filter:brightness(1.1); }
.btn.danger{ background:var(--danger);color:#fff;border-color:var(--danger); }
.btn.danger:hover{ filter:brightness(1.1); }

/* ── BODY ── */
.page-body{ padding:20px clamp(12px,2.5vw,24px); }

/* ── TOOLBAR ── */
.toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-bottom:16px;
}
.toolbar-title{
  font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;
  letter-spacing:1px;color:#0f172a;flex:1;
}
.toolbar-count{
  font-family:'Nunito',sans-serif;font-size:12px;font-weight:600;
  color:var(--muted);background:#f1f5f9;padding:4px 10px;border-radius:20px;
}

/* ── TABLA ── */
.table-wrap{
  background:#fff;border-radius:12px;border:1.5px solid var(--border);
  box-shadow:0 1px 4px rgba(0,0,0,.04);overflow:hidden;
}
table{ width:100%;border-collapse:collapse; }
thead tr:first-child{ background:#f8fafc;border-bottom:2px solid var(--border); }
th{
  padding:10px 14px;text-align:left;
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:800;
  letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);white-space:nowrap;
}
.col-filters td{ padding:4px 14px 8px;background:#f8fafc; }
.col-input{
  width:100%;padding:5px 8px;border:1.5px solid var(--border);border-radius:6px;
  font-family:'Nunito',sans-serif;font-size:12px;color:#0f172a;background:#fff;outline:none;
}
.col-input:focus{ border-color:var(--accent); }
tbody tr{ border-bottom:1px solid #f1f5f9;transition:background .12s; }
tbody tr:last-child{ border-bottom:none; }
tbody tr:hover{ background:#f0f7ff; }
td{ padding:10px 14px;font-family:'Nunito',sans-serif;font-size:13px;color:#0f172a; }
.td-mod{
  font-family:'Courier New',monospace;font-size:12px;font-weight:700;
  background:#f1f5f9;color:var(--accent2);border:1px solid var(--border);
  padding:2px 8px;border-radius:4px;display:inline-block;
}
.td-num{ font-family:'Courier New',monospace;font-size:13px;font-weight:700;color:var(--accent2); }
.td-actions{ display:flex;gap:6px;align-items:center; }
.action-btn{
  padding:4px 10px;border-radius:6px;border:1.5px solid var(--border);
  background:#fff;cursor:pointer;font-size:12px;font-weight:700;
  font-family:'Barlow Condensed',sans-serif;letter-spacing:.3px;transition:all .15s;
}
.action-btn.edit{ color:var(--accent2);border-color:#bfdbfe; }
.action-btn.edit:hover{ background:#eff6ff;border-color:var(--accent); }
.action-btn.del{ color:var(--danger);border-color:#fecaca; }
.action-btn.del:hover{ background:#fef2f2;border-color:var(--danger); }
.empty-row td{
  text-align:center;padding:60px 20px;color:#94a3b8;
  font-family:'Barlow Condensed',sans-serif;font-size:16px;letter-spacing:2px;
}

/* ── MODAL ── */
.modal-overlay{
  display:none;position:fixed;inset:0;z-index:500;
  background:rgba(15,23,42,.5);backdrop-filter:blur(4px);
  align-items:center;justify-content:center;padding:16px;
}
.modal-overlay.open{ display:flex; }
.modal-box{
  background:#fff;border-radius:18px;padding:32px 28px 24px;
  width:100%;max-width:480px;box-shadow:0 24px 60px rgba(15,23,42,.18);
  animation:slideUp .22s ease;
}
@keyframes slideUp{ from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }
.modal-title{
  font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;
  letter-spacing:2px;text-transform:uppercase;color:var(--accent2);margin-bottom:20px;
}
.field{ margin-bottom:14px; }
.field label{
  display:block;font-size:10px;font-weight:800;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px;
}
.field input, .field select{
  width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;
  font-family:'Nunito',sans-serif;font-size:14px;color:#0f172a;background:#f8fafc;outline:none;
  transition:border-color .2s;
}
.field input:focus, .field select:focus{ border-color:var(--accent); }
.field input.error{ border-color:var(--danger); }
.modal-btns{ display:flex;gap:10px;margin-top:20px; }
.modal-btns .btn{ flex:1;justify-content:center; }

/* ── CONFIRM DELETE ── */
#confirm-del-overlay .modal-box{ max-width:360px; }

/* ── TOAST ── */
#ord-toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:#0f172a;color:#fff;padding:12px 24px;border-radius:12px;
  font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;
  z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.2);
  opacity:0;transition:opacity .2s;pointer-events:none;
}
#ord-toast.show{ opacity:1; }

@media(max-width:600px){
  .toolbar{ flex-direction:column;align-items:stretch; }
  .toolbar-title{ font-size:18px; }
  th, td{ padding:8px 10px; }
}
</style>
<style>
/* ── NAV MENÚ DESPLEGABLE ── */
.millar-nav{display:flex;align-items:center;gap:2px;}
.millar-nav-item{position:relative;}
.millar-nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 14px;border-radius:8px;border:none;background:transparent;
  cursor:pointer;transition:background .15s;min-width:60px;
}
.millar-nav-btn:hover{background:#f1f5f9;}
.millar-nav-btn.active{background:#eff6ff;}
.millar-nav-btn svg{flex-shrink:0;opacity:.65;}
.millar-nav-btn:hover svg,.millar-nav-btn.active svg{opacity:1;}
.millar-nav-label{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;color:#475569;white-space:nowrap;
}
.millar-nav-btn:hover .millar-nav-label,.millar-nav-btn.active .millar-nav-label{color:#1e40af;}
.millar-dropdown{
  display:none;position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);
  min-width:200px;background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.1);z-index:9999;overflow:visible;
  animation:dropIn .15s ease;
}
@keyframes dropIn{from{opacity:0;transform:translateX(-50%) translateY(-6px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.millar-dropdown.open{display:block;}
.millar-dd-inner{padding:6px;}
.millar-dd-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 12px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;
  font-size:13px;font-weight:700;letter-spacing:.3px;color:#0f172a;
  cursor:pointer;transition:background .12s;text-decoration:none;
  white-space:nowrap;
}
.millar-dd-item:hover{background:#f1f5f9;color:#1e40af;}
.millar-dd-item.has-sub{position:relative;}
.millar-dd-item.has-sub:hover .millar-sub{display:block;}
.millar-sub{
  display:none;position:absolute;left:100%;top:-6px;
  min-width:180px;background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.1);z-index:10000;padding:6px;
}
.millar-sub-item{
  display:flex;align-items:center;gap:8px;
  padding:9px 12px;border-radius:8px;font-family:'Barlow Condensed',sans-serif;
  font-size:13px;font-weight:700;letter-spacing:.3px;color:#0f172a;
  cursor:pointer;transition:background .12s;text-decoration:none;white-space:nowrap;
}
.millar-sub-item:hover{background:#f1f5f9;color:#1e40af;}
.millar-dd-sep{height:1px;background:#f1f5f9;margin:4px 0;}
</style>

<script>
// ══════════════════════════════════════════════════════
//  ÓRDENES DE PRODUCCIÓN
// ══════════════════════════════════════════════════════
let ordenes = [];
let editingIdx = null;
let deletingIdx = null;

// ── Cargar datos del servidor ──────────────────────────
async function cargarOrdenes(){
  try{
    const r = await fetch('/api/ordenes');
    ordenes = await r.json();
  } catch(e){ ordenes = []; }
  renderTabla();
}

// ── Cargar módulos activos ──────────────────────────────
async function cargarModulos(){
  try{
    const r = await fetch('/api/modules');
    const mods = await r.json();
    const sel = document.getElementById('f-modulo');
    sel.innerHTML = '<option value="">— Seleccionar —</option>';
    (mods||[]).forEach(m=>{
      const o = document.createElement('option');
      o.value = m; o.textContent = m;
      sel.appendChild(o);
    });
  } catch(e){}
}

// ── Guardar en servidor ────────────────────────────────
async function guardarEnServidor(){
  try{
    await fetch('/api/ordenes',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(ordenes)
    });
  } catch(e){ showToast('⚠ Error al guardar en el servidor'); }
}

// ── Renderizar tabla ───────────────────────────────────
function renderTabla(){
  const cfMod  = (document.getElementById('cf-modulo')?.value||'').toLowerCase().trim();
  const cfRef  = (document.getElementById('cf-referencia')?.value||'').toLowerCase().trim();
  const cfOp   = (document.getElementById('cf-opoc')?.value||'').toLowerCase().trim();
  const cfCant = (document.getElementById('cf-cantidad')?.value||'').toLowerCase().trim();
  const cfFech = (document.getElementById('cf-fecha')?.value||'').toLowerCase().trim();

  let rows = ordenes.map((o,i)=>({...o, _idx:i}));
  if(cfMod)  rows = rows.filter(r=>(r.modulo||'').toLowerCase().includes(cfMod));
  if(cfRef)  rows = rows.filter(r=>(r.referencia||'').toLowerCase().includes(cfRef));
  if(cfOp)   rows = rows.filter(r=>(r.opoc||'').toLowerCase().includes(cfOp));
  if(cfCant) rows = rows.filter(r=>String(r.cantidad||'').includes(cfCant));
  if(cfFech) rows = rows.filter(r=>(r.fecha||'').toLowerCase().includes(cfFech));

  const tbody = document.getElementById('ord-tbody');
  const countEl = document.getElementById('ord-count');
  countEl.textContent = rows.length + ' orden' + (rows.length!==1?'es':'');

  if(rows.length === 0){
    tbody.innerHTML = `<tr class="empty-row"><td colspan="7">📋 No hay órdenes para mostrar</td></tr>`;
    actualizarBtnDel();
    return;
  }

  tbody.innerHTML = rows.map(r=>`
    <tr>
      <td style="text-align:center;">
        <input type="checkbox" class="chk-row" data-idx="${r._idx}" onchange="onCheckRow()" style="width:15px;height:15px;cursor:pointer;accent-color:#2563eb;">
      </td>
      <td><span class="td-mod">${r.modulo||'—'}</span></td>
      <td>${r.referencia||'—'}</td>
      <td style="font-family:'Courier New',monospace;font-size:13px;">${r.opoc||'—'}</td>
      <td><span class="td-num">${r.cantidad||'—'}</span></td>
      <td style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:#0f172a;text-align:center;">${r.metaHora||'—'}</td>
      <td style="font-size:12px;color:#64748b;">${r.fecha||'—'}</td>
      <td>
        <div class="td-actions">
          <button class="action-btn edit" onclick="abrirEditar(${r._idx})" title="Editar" style="padding:5px 9px;font-size:15px;">✏️</button>
          <button class="action-btn del"  onclick="abrirConfirmDel(${r._idx})">🗑</button>
        </div>
      </td>
    </tr>`).join('');

  actualizarBtnDel();
  // Restaurar checkboxes seleccionados
  document.querySelectorAll('.chk-row').forEach(chk=>{
    if(_seleccionados.has(parseInt(chk.dataset.idx))) chk.checked=true;
  });
  // Actualizar check-all
  const chkAll = document.getElementById('chk-all');
  if(chkAll) chkAll.checked = rows.length>0 && rows.every(r=>_seleccionados.has(r._idx));
}

// ── Modal crear / editar ───────────────────────────────
function abrirModal(){
  editingIdx = null;
  document.getElementById('form-title').textContent = 'Nueva Orden';
  document.getElementById('f-modulo').value = '';
  document.getElementById('f-referencia').value = '';
  document.getElementById('f-opoc').value = '';
  document.getElementById('f-cantidad').value = '';
  document.getElementById('f-metahora').value = '';
  document.getElementById('form-error').style.display = 'none';
  ['f-modulo','f-referencia','f-cantidad'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.style.borderColor = '#e2e8f0';
  });
  document.getElementById('form-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('f-referencia').focus(), 100);
}

function abrirEditar(idx){
  editingIdx = idx;
  const o = ordenes[idx];
  if(!o) return;
  document.getElementById('form-title').textContent = 'Editar Orden';
  document.getElementById('f-modulo').value    = o.modulo    || '';
  document.getElementById('f-referencia').value= o.referencia|| '';
  document.getElementById('f-opoc').value      = o.opoc      || '';
  document.getElementById('f-cantidad').value  = o.cantidad  || '';
  document.getElementById('f-metahora').value  = o.metaHora  || '';
  document.getElementById('form-error').style.display = 'none';
  document.getElementById('form-overlay').classList.add('open');
}

function cerrarModal(){
  document.getElementById('form-overlay').classList.remove('open');
  editingIdx = null;
}

function guardarOrden(){
  const modulo     = document.getElementById('f-modulo').value.trim();
  const referencia = document.getElementById('f-referencia').value.trim();
  const opoc       = document.getElementById('f-opoc').value.trim();
  const cantidad   = document.getElementById('f-cantidad').value.trim();
  const metaHora   = document.getElementById('f-metahora').value.trim();
  const errEl      = document.getElementById('form-error');

  // Validar obligatorios
  let hasError = false;
  if(!modulo){    document.getElementById('f-modulo').style.borderColor='#ef4444';    hasError=true; } else document.getElementById('f-modulo').style.borderColor='#e2e8f0';
  if(!referencia){ document.getElementById('f-referencia').style.borderColor='#ef4444'; hasError=true; } else document.getElementById('f-referencia').style.borderColor='#e2e8f0';
  if(!cantidad){  document.getElementById('f-cantidad').style.borderColor='#ef4444';  hasError=true; } else document.getElementById('f-cantidad').style.borderColor='#e2e8f0';

  if(hasError){
    errEl.textContent = 'Completa los campos obligatorios';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';

  const orden = { modulo, referencia, opoc, cantidad: parseInt(cantidad)||0, fecha: new Date().toLocaleDateString('es-CO') };

  if(editingIdx !== null){
    ordenes[editingIdx] = orden;
    showToast('✅ Orden actualizada');
  } else {
    ordenes.push(orden);
    showToast('✅ Orden creada');
  }

  _seleccionados.clear();
  guardarEnServidor();
  cerrarModal();
  renderTabla();
}

// ── Eliminar ───────────────────────────────────────────
function abrirConfirmDel(idx){
  deletingIdx = idx;
  document.getElementById('confirm-del-overlay').classList.add('open');
}

function cerrarConfirmDel(){
  deletingIdx = null;
  document.getElementById('confirm-del-overlay').classList.remove('open');
}

function confirmarEliminar(){
  if(deletingIdx === null) return;
  ordenes.splice(deletingIdx, 1);
  _seleccionados.clear();
  guardarEnServidor();
  cerrarConfirmDel();
  renderTabla();
  showToast('🗑 Orden eliminada');
}

// ── Selección múltiple ─────────────────────────────────
let _seleccionados = new Set();

function onCheckRow(){
  _seleccionados.clear();
  document.querySelectorAll('.chk-row:checked').forEach(chk=>{
    _seleccionados.add(parseInt(chk.dataset.idx));
  });
  actualizarBtnDel();
  // Actualizar check-all
  const total = document.querySelectorAll('.chk-row').length;
  const sel   = document.querySelectorAll('.chk-row:checked').length;
  const chkAll = document.getElementById('chk-all');
  if(chkAll) chkAll.checked = total>0 && sel===total;
}

function toggleSelAll(checked){
  _seleccionados.clear();
  document.querySelectorAll('.chk-row').forEach(chk=>{
    chk.checked = checked;
    if(checked) _seleccionados.add(parseInt(chk.dataset.idx));
  });
  actualizarBtnDel();
}

function actualizarBtnDel(){
  const btn = document.getElementById('btn-del-sel');
  const cnt = document.getElementById('sel-count');
  if(!btn) return;
  if(_seleccionados.size > 0){
    btn.style.display='flex';
    if(cnt) cnt.textContent = _seleccionados.size;
  } else {
    btn.style.display='none';
  }
}

function eliminarSeleccionados(){
  if(_seleccionados.size === 0) return;
  if(!confirm('¿Eliminar ' + _seleccionados.size + ' orden(es) seleccionada(s)? Esta acción no se puede deshacer.')) return;
  // Eliminar de mayor a menor índice para no desplazar
  const indices = [..._seleccionados].sort((a,b)=>b-a);
  indices.forEach(i => ordenes.splice(i,1));
  _seleccionados.clear();
  guardarEnServidor();
  renderTabla();
  showToast('🗑 ' + indices.length + ' orden(es) eliminada(s)');
}

// ── Exportar Excel ─────────────────────────────────────
function exportarExcel(){
  const rows = ordenes.length > 0
    ? ordenes.map(o=>({
        'Módulo':     o.modulo||'',
        'Referencia': o.referencia||'',
        'OP / OC':    o.opoc||'',
        'Cantidad':   o.cantidad||0,
        'Fecha':      o.fecha||''
      }))
    : [{ 'Módulo':'', 'Referencia':'', 'OP / OC':'', 'Cantidad':0, 'Fecha':'' }]; // plantilla vacía
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:12},{wch:20},{wch:14},{wch:12},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Órdenes');
  const fecha = new Date().toISOString().split('T')[0];
  const fname = ordenes.length > 0 ? 'Ordenes_Produccion_'+fecha+'.xlsx' : 'Plantilla_Ordenes.xlsx';
  XLSX.writeFile(wb, fname);
  showToast(ordenes.length > 0 ? '📤 Excel exportado' : '📋 Plantilla descargada');
}

// ── Importar Excel ─────────────────────────────────────
function abrirImportExcel(){
  document.getElementById('import-file').click();
}

function importarExcel(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const wb = XLSX.read(ev.target.result, {type:'binary'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws);
      let importadas = 0;
      data.forEach(row=>{
        const modulo     = String(row['Módulo']||row['Modulo']||row['modulo']||'').trim();
        const referencia = String(row['Referencia']||row['referencia']||'').trim();
        const opoc       = String(row['OP / OC']||row['OP/OC']||row['opoc']||'').trim();
        const cantidad   = parseInt(row['Cantidad']||row['cantidad']||0)||0;
        if(modulo && referencia){
          ordenes.push({ modulo, referencia, opoc, cantidad, fecha: new Date().toLocaleDateString('es-CO') });
          importadas++;
        }
      });
      if(importadas > 0){
        guardarEnServidor();
        renderTabla();
        showToast('📥 ' + importadas + ' orden(es) importada(s)');
      } else {
        showToast('⚠ No se encontraron órdenes válidas en el archivo');
      }
    } catch(err){
      showToast('⚠ Error al leer el archivo Excel');
    }
    e.target.value = '';
  };
  reader.readAsBinaryString(file);
}

// ── Toast ──────────────────────────────────────────────
let _toastTimer = null;
function showToast(msg){
  const t = document.getElementById('ord-toast');
  t.textContent = msg;
  t.classList.add('show');
  if(_toastTimer) clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>t.classList.remove('show'), 2800);
}

// ── Cerrar modales con Escape ──────────────────────────
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    cerrarModal();
    cerrarConfirmDel();
  }
});

// ── Click fuera del modal para cerrar ─────────────────
document.getElementById('form-overlay').addEventListener('click', e=>{
  if(e.target === document.getElementById('form-overlay')) cerrarModal();
});
document.getElementById('confirm-del-overlay').addEventListener('click', e=>{
  if(e.target === document.getElementById('confirm-del-overlay')) cerrarConfirmDel();
});

// ── Init ───────────────────────────────────────────────
cargarModulos();
cargarOrdenes();
</script>
<script>
// ── MILLAR NAV — navegación global ──────────────────────────────
(function(){
  // Detectar perfil desde URL o sessionStorage
  function getNavPerfil(){
    const p = new URLSearchParams(location.search).get('perfil') ||
              sessionStorage.getItem('millar_nav_perfil') || '';
    return p.toLowerCase();
  }

  // Rutas
  const RUTAS = {
    ordenes:        '/ordenes',
    asistencia:     '/ingresos',
    recogedores:    '/recogedores',
    tableroGeneral: '/?tablero=general',
    tableroMec:     '/?tablero=mecanicos',
    tableroCI:      '/ci',
    insumos:        '/solicitar-insumos',
    registroMecanico: '/registro-mecanicos',
    alistamiento:   '/alistamiento?seccion=alistamiento',
    mantenimiento:  '/alistamiento?seccion=mantenimiento',
    contador:       '/contador-modulos',
    informeCI:      '/ci?seccion=informe',
    informeGeneral: '/?seccion=historico',
    dashCI:         '/ci?seccion=dashboard',
    dashPlanta:     '/dashboard-planta',
  };

  function ir(ruta){
    const perfil = getNavPerfil();
    const sep = ruta.includes('?') ? '&' : '?';
    location.href = perfil ? ruta + sep + 'perfil=' + encodeURIComponent(perfil) : ruta;
  }

  // Permisos por perfil
  const PERMISOS = {
    programador:  ['produccion','tableros','mecanicos','modulos','informes'],
    administrador:['produccion','tableros','mecanicos','modulos','informes'],
    supervisora:  ['asistencia'],
    mecanicos:    ['tableroMec','insumos','montajes'],
    televisor:    ['tableroGeneral','tableroMec','tableroCI'],
    recogedores:  ['recogedores'],
  };

  // Íconos SVG
  const ICONS = {
    produccion: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>',
    tableros:   '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
    mecanicos:  '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>',
    modulos:    '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5.22 5.22l2.12 2.12M16.66 16.66l2.12 2.12M5.22 18.78l2.12-2.12M16.66 7.34l2.12-2.12"/></svg>',
    informes:   '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>',
  };

  const FLECHA = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4.5 3l3 3-3 3"/></svg>';

  function buildNav(){
    const perfil = getNavPerfil();
    const esAdmin = !perfil || ['programador','administrador'].includes(perfil);
    const esMec   = perfil === 'mecanicos';
    const esTV    = perfil === 'televisor';
    const esSup   = perfil === 'supervisora';
    const esRec   = perfil === 'recogedores';

    let html = '<div class="millar-nav" id="millar-nav">';

    // ── PRODUCCIÓN ──
    const prodItems = [];
    if(esAdmin) prodItems.push(`<a class="millar-dd-item" onclick="ir(RUTAS.ordenes)">📋 Órdenes</a>`);
    if(esAdmin||esSup) prodItems.push(`<a class="millar-dd-item" onclick="ir(RUTAS.asistencia)">⏱ Control Asistencia</a>`);
    if(esAdmin||esRec) prodItems.push(`<a class="millar-dd-item" onclick="ir(RUTAS.recogedores)">🧺 Conteo Recogedores</a>`);
    if(prodItems.length){
      html += buildBtn('produccion','Producción',prodItems);
    }

    // ── TABLEROS ──
    const tabItems = [];
    if(esAdmin||esTV) tabItems.push(`<a class="millar-dd-item" onclick="ir(RUTAS.tableroGeneral)">🏭 Tablero General</a>`);
    if(esAdmin||esTV||esMec) tabItems.push(`<a class="millar-dd-item" onclick="ir(RUTAS.tableroMec)">🔧 Tablero Mecánicos</a>`);
    if(esAdmin||esTV) tabItems.push(`<a class="millar-dd-item" onclick="ir(RUTAS.tableroCI)">📦 Tablero CI</a>`);
    if(tabItems.length){
      html += buildBtn('tableros','Tableros',tabItems);

    // ── MECÁNICOS ──
    const mecItems = [];
    if(esAdmin||esMec) mecItems.push(`<a class="millar-dd-item" onclick="ir(RUTAS.insumos)">📦 Solicitar Insumos</a>`);
    if(esAdmin||esMec){
      mecItems.push(`<a class="millar-dd-item" onclick="ir(RUTAS.registroMecanico)">🔧 Registro MMT Mecánico</a>`);
    }
    if(mecItems.length){
      html += buildBtn('mecanicos','Mecánicos',mecItems);
    }

    // ── MÓDULOS ──
    if(esAdmin){
      html += buildBtn('modulos','Módulos',[
        `<a class="millar-dd-item" onclick="ir(RUTAS.contador)">🟢 Contador Módulos</a>`
      ]);
    }

    // ── INFORMES ──
    if(esAdmin){
      html += buildBtn('informes','Informes',[
        `<div class="millar-dd-sep"></div>
         <div style="padding:4px 12px;font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#94a3b8;">Informes</div>`,
        `<a class="millar-dd-item" onclick="ir(RUTAS.informeGeneral)">📊 Informe General</a>`,
        `<a class="millar-dd-item" onclick="ir(RUTAS.informeCI)">📋 Informe CI</a>`,
        `<div class="millar-dd-sep"></div>
         <div style="padding:4px 12px;font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#94a3b8;">Dashboard</div>`,

      ]);
    }

    html += '</div>';
    return html;
  }

  function buildBtn(key, label, items){
    const ddId = 'millar-dd-' + key;
    return `
      <div class="millar-nav-item">
        <button class="millar-nav-btn" onclick="millarNavToggle('${ddId}')">
          ${ICONS[key]||''}
          <span class="millar-nav-label">${label}</span>
        </button>
        <div class="millar-dropdown" id="${ddId}">
          <div class="millar-dd-inner">
            ${items.join('')}
          </div>
        </div>
      </div>`;
  }

  // Toggle dropdown
  window.millarNavToggle = function(id){
    const all = document.querySelectorAll('.millar-dropdown');
    all.forEach(d=>{ if(d.id!==id) d.classList.remove('open'); });
    document.getElementById(id)?.classList.toggle('open');
  };

  // Cerrar al click fuera
  document.addEventListener('click', function(e){
    if(!e.target.closest('.millar-nav-item')){
      document.querySelectorAll('.millar-dropdown').forEach(d=>d.classList.remove('open'));
    }
  });

  // Exponer ir() globalmente
  window.RUTAS = RUTAS;
  window.ir = ir;

  // Inyectar cuando el DOM esté listo
  function inject(){
    const targets = document.querySelectorAll('[data-millar-nav]');
    targets.forEach(el=>{ el.innerHTML = buildNav(); });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', inject);
  } else {
    inject();
  }
})();
