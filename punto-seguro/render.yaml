# ============================================
# PUNTO SEGURO — Blueprint de Render
# Define: 1 servicio web (Docker) + 1 base de datos PostgreSQL
# Docs: https://render.com/docs/blueprint-spec
# ============================================
databases:
  - name: punto-seguro-db
    databaseName: punto_seguro
    plan: free
    region: oregon

services:
  - type: web
    name: punto-seguro-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: punto-seguro-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
