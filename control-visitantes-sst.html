<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Control de Visitantes SST — MES | Millar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0f172a;
    --paper:#f1f5f9;
    --paper-2:#f8fafc;
    --steel:#64748b;
    --steel-soft:#64748b1a;
    --safety:#2563eb;
    --safety-dark:#1e3a8a;
    --line:#e2e8f0;
    --confirm:#16a34a;
    --confirm-soft:#16a34a1a;
    --alert:#ef4444;
    --alert-soft:#ef44441a;
    --radius:9px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Nunito',sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  #app{max-width:100%;margin:0;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;}

  /* ---------- HEADER ---------- */
  .topbar{
    padding:0 clamp(16px,4vw,40px);
    height:64px;
    background:#fff;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    position:relative;
  }
  .topbar::after{
    content:'';position:absolute;bottom:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,#1e3a8a,#2563eb,#60a5fa);
  }
  .topbar .left{display:flex;align-items:center;gap:14px;}
  .topbar-logo{height:40px;width:auto;display:block;}
  .topbar-brand{display:flex;flex-direction:column;gap:1px;}
  .eyebrow{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.12em;
    font-size:.68rem;
    color:var(--steel);
  }
  .brand-title{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:800;
    font-size:1.5rem;
    line-height:1;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--ink);
  }
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .clock-wrap{text-align:right;}
  #clockDisplay{
    font-family:'IBM Plex Mono',monospace;
    font-size:.78rem;
    color:var(--ink);
    font-weight:500;
    display:block;
  }
  .clock-label{
    font-family:'Barlow Condensed',sans-serif;
    font-size:.64rem;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--steel);
    display:block;
  }
  .storage-badge{
    display:inline-block;margin-top:4px;font-size:.64rem;font-weight:600;
    padding:2px 8px;border-radius:10px;letter-spacing:.03em;
    font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;
  }
  .storage-badge.local{background:#2563eb26;color:var(--safety-dark);}
  .storage-badge.cloud{background:var(--confirm-soft);color:var(--confirm);}
  .btn-volver{
    display:inline-flex;align-items:center;gap:5px;
    padding:7px 14px;border-radius:8px;border:1.5px solid var(--line);
    background:#fff;color:var(--safety-dark);
    font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;
    letter-spacing:1px;text-transform:uppercase;text-decoration:none;
    transition:all .2s;white-space:nowrap;
  }
  .btn-volver:hover{background:var(--paper);border-color:#94a3b8;}

  /* ---------- MODULE BAR ---------- */
  .module-bar{
    display:flex;gap:8px;padding:10px clamp(16px,4vw,40px);background:#1e3a8a;
  }
  .module-pill{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
    font-size:.82rem;padding:9px 16px;border-radius:30px;border:1.5px solid #ffffff33;
    background:transparent;color:#ffffffb0;cursor:pointer;transition:all .15s;
  }
  .module-pill:hover{border-color:#ffffff66;color:#fff;}
  .module-pill.active{background:var(--safety);border-color:var(--safety);color:#fff;}

  /* ---------- TABS ---------- */
  .tabs{
    display:flex;
    gap:2px;
    padding:0 clamp(16px,4vw,40px);
    border-bottom:1px solid var(--line);
    background:var(--paper-2);
  }
  .tab{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.05em;
    font-size:.92rem;
    padding:14px 18px 12px;
    border:none;
    background:none;
    color:var(--steel);
    cursor:pointer;
    position:relative;
    transition:color .15s;
  }
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--ink);}
  .tab.active::after{
    content:'';
    position:absolute;left:14px;right:14px;bottom:-1px;height:3px;
    background:var(--safety);
    border-radius:2px 2px 0 0;
  }

  /* ---------- MAIN VIEW ---------- */
  #view{flex:1;padding:clamp(16px,4vw,40px);}
  .panel{
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    padding:clamp(20px,4vw,32px);
    max-width:620px;
    margin:0 auto;
  }
  .panel.wide{max-width:100%;}
  .step-eyebrow{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.1em;
    font-size:.72rem;
    color:var(--safety-dark);
    margin:0 0 6px;
  }
  .panel h2{
    font-family:'Barlow Condensed',sans-serif;
    font-size:clamp(1.4rem,3vw,1.7rem);
    margin:0 0 18px;
    font-weight:700;
  }
  .banner{
    background:var(--confirm-soft);
    border:1px solid var(--confirm);
    color:var(--confirm);
    border-radius:var(--radius);
    padding:10px 14px;
    font-size:.88rem;
    margin-bottom:18px;
    font-weight:500;
  }
  .banner.banner-nuevo{
    background:#2563eb1f;
    border-color:var(--safety);
    color:var(--safety-dark);
  }
  .field-row{display:flex;gap:14px;}
  .field{margin-bottom:16px;flex:1;}
  .field.grow{flex:2;}
  .field label{
    display:block;
    font-size:.78rem;
    font-weight:600;
    color:var(--steel);
    margin-bottom:5px;
    letter-spacing:.01em;
  }
  .field .hint{font-size:.72rem;color:#8a8473;font-weight:400;margin-left:4px;}
  input[type="text"], input[type="tel"], input:not([type]), select, input[inputmode]{
    width:100%;
    padding:12px 13px;
    border:1.5px solid var(--line);
    border-radius:var(--radius);
    font-family:'Nunito',sans-serif;
    font-size:1rem;
    background:#fff;
    color:var(--ink);
  }
  input:focus, select:focus{outline:none;border-color:var(--steel);background:#fff;}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--steel) 50%),linear-gradient(135deg,var(--steel) 50%,transparent 50%);background-position:calc(100% - 18px) center,calc(100% - 13px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}

  .meta-row{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:10px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);
    margin:18px 0;font-size:.85rem;color:var(--steel);
  }
  .meta-row strong{font-family:'IBM Plex Mono',monospace;color:var(--ink);font-weight:600;font-size:.85rem;}

  .declaracion{
    display:flex;gap:10px;align-items:flex-start;
    background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px;margin-bottom:20px;font-size:.83rem;line-height:1.45;color:var(--ink);
  }
  .declaracion input{width:auto;margin-top:3px;flex-shrink:0;accent-color:var(--steel);}

  .firma-label{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;
    letter-spacing:.08em;font-size:.74rem;color:var(--steel);margin:0 0 8px;
  }
  .firma-box{margin-bottom:18px;}
  .sig-canvas{
    width:100%;height:160px;border-radius:var(--radius);
    border:1.5px dashed var(--steel);
    background:
      repeating-linear-gradient(transparent,transparent 39px,var(--line) 39px,var(--line) 40px),
      #fdfcf9;
    touch-action:none;cursor:crosshair;
  }
  .firma-existente{
    border:1.5px solid var(--line);border-radius:var(--radius);padding:12px;background:#fff;
    display:flex;flex-direction:column;align-items:flex-start;gap:8px;
  }
  .firma-existente img{height:90px;max-width:100%;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:4px;padding:4px;}

  .form-error{
    display:none;background:var(--alert-soft);border:1px solid var(--alert);color:var(--alert);
    padding:10px 13px;border-radius:var(--radius);font-size:.85rem;margin-bottom:14px;font-weight:500;
  }

  .btn{
    font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
    font-size:.88rem;padding:13px 22px;border-radius:var(--radius);border:1.5px solid transparent;
    cursor:pointer;transition:transform .08s, background .15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;width:100%;padding:15px 22px;font-size:.95rem;box-shadow:0 4px 14px rgba(37,99,235,.3);}
  .btn-primary:hover{background:linear-gradient(135deg,#1e3a8a,#1d4ed8);}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--steel);}
  .btn-ghost:hover{border-color:var(--steel);color:var(--ink);}
  .btn-ghost.small{padding:8px 14px;font-size:.78rem;}
  .btn-row{display:flex;gap:10px;align-items:center;margin-top:6px;}
  .btn-row .btn-ghost{flex-shrink:0;}
  .btn-danger{background:transparent;border-color:var(--alert);color:var(--alert);}
  .btn-danger:hover{background:var(--alert-soft);}

  /* ---------- SALIDA ---------- */
  .filtro-bar{display:flex;gap:10px;margin-bottom:18px;max-width:620px;margin-inline:auto;}
  .filtro-bar input{flex:1;}
  .lista-activos{display:flex;flex-direction:column;gap:10px;max-width:620px;margin:0 auto;}
  .visitante-card{
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .visitante-card .info strong{display:block;font-size:1rem;}
  .visitante-card .info span{font-size:.8rem;color:var(--steel);}
  .empty-state{
    text-align:center;color:var(--steel);padding:50px 20px;max-width:620px;margin:0 auto;
    border:1.5px dashed var(--line);border-radius:10px;font-size:.92rem;
  }
  .empty-state strong{display:block;color:var(--ink);font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;margin-bottom:6px;font-weight:700;}

  /* ---------- HISTORIAL ---------- */
  .historial-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
  .historial-filtros{display:flex;gap:10px;flex-wrap:wrap;flex:1;}
  .historial-filtros input{min-width:160px;flex:1;}
  .historial-acciones{display:flex;gap:8px;}
  table.hist-table{width:100%;border-collapse:collapse;font-size:.83rem;background:#fff;}
  table.hist-table th{
    font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.05em;
    font-size:.68rem;color:var(--steel);text-align:left;padding:9px 10px;border-bottom:2px solid var(--ink);white-space:nowrap;
  }
  table.hist-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  table.hist-table tr:hover td{background:var(--paper-2);}
  .badge{
    font-family:'Barlow Condensed',sans-serif;font-size:.66rem;font-weight:700;text-transform:uppercase;
    letter-spacing:.04em;padding:3px 8px;border-radius:20px;white-space:nowrap;
  }
  .badge.dentro{background:var(--confirm-soft);color:var(--confirm);}
  .badge.fuera{background:var(--steel-soft);color:var(--steel);}
  .badge.noregreso{background:var(--alert-soft);color:var(--alert);}
  .badge.entrada{background:#2563eb1a;color:#2563eb;}

  /* ---------- BÚSQUEDA EN NÓMINA ---------- */
  .nomina-suggestions{
    margin-top:6px;border:1px solid var(--line);border-radius:var(--radius);
    background:#fff;max-height:230px;overflow-y:auto;display:none;
  }
  .nomina-suggestions.show{display:block;}
  .nomina-item{
    padding:10px 13px;cursor:pointer;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.88rem;
  }
  .nomina-item:last-child{border-bottom:none;}
  .nomina-item:hover{background:var(--paper-2);}
  .nomina-item .nm-doc{font-family:'IBM Plex Mono',monospace;font-size:.76rem;color:var(--steel);flex-shrink:0;}
  .nomina-empty-msg{padding:10px 13px;font-size:.82rem;color:var(--steel);}
  .divider-or{
    display:flex;align-items:center;gap:10px;margin:20px 0 16px;color:var(--steel);font-size:.74rem;
    text-transform:uppercase;letter-spacing:.08em;font-family:'Barlow Condensed',sans-serif;font-weight:600;
  }
  .divider-or::before,.divider-or::after{content:'';flex:1;height:1px;background:var(--line);}

  /* ---------- CARGA DE NÓMINA (CONFIG) ---------- */
  .nomina-upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;}
  .nomina-upload-grid textarea{
    width:100%;min-height:120px;padding:12px 13px;border:1.5px solid var(--line);border-radius:var(--radius);
    font-family:'IBM Plex Mono',monospace;font-size:.8rem;background:#fff;resize:vertical;
  }
  .nomina-upload-grid textarea:focus{outline:none;border-color:var(--steel);background:#fff;}
  .nomina-stats{display:flex;justify-content:space-between;align-items:center;margin:14px 0 10px;}
  .nomina-table-wrap{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;}
  @media (max-width:680px){ .nomina-upload-grid{grid-template-columns:1fr;} }
  .mono{font-family:'IBM Plex Mono',monospace;font-size:.78rem;}
  .firma-thumb{height:24px;max-width:60px;object-fit:contain;}
  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;}
  .historial-footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
  .count-note{font-size:.78rem;color:var(--steel);}

  /* ---------- STAMP OVERLAY ---------- */
  .stamp-overlay{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(28,35,51,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;
  }
  .stamp-overlay.show{opacity:1;pointer-events:auto;}
  .stamp-ring{
    width:230px;height:230px;border-radius:50%;border:6px solid var(--confirm);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:#fff;color:var(--confirm);
    transform:scale(1.45) rotate(-12deg);opacity:0;
  }
  .stamp-overlay.show .stamp-ring{animation:stampPress .45s cubic-bezier(.2,1.5,.4,1) forwards;}
  @keyframes stampPress{to{transform:scale(1) rotate(-7deg);opacity:1;}}
  .stamp-check{font-size:2.6rem;line-height:1;}
  .stamp-title{font-family:'Barlow Condensed',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:1rem;margin:0;text-align:center;padding:0 14px;}
  .stamp-sub{font-family:'IBM Plex Mono',monospace;font-size:.7rem;margin:0;color:var(--steel);}

  :focus-visible{outline:2.5px solid var(--safety-dark);outline-offset:2px;}
  input.uc-field, textarea.uc-field{text-transform:uppercase;}

  /* ---------- TOAST ---------- */
  #toastBox{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;
    font-size:.85rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
    z-index:80;max-width:90vw;text-align:center;
  }
  #toastBox.show{opacity:1;transform:translate(-50%,0);}
  #toastBox.error{background:var(--alert);}

  /* ---------- CONFIRM MODAL ---------- */
  .confirm-overlay{
    position:fixed;inset:0;background:rgba(28,35,51,.55);display:flex;align-items:center;justify-content:center;
    z-index:90;padding:20px;
  }
  .confirm-box{
    background:#fff;border-radius:10px;padding:24px;max-width:380px;width:100%;
    border:1px solid var(--line);
  }
  .confirm-box p{margin:0 0 18px;font-size:.92rem;line-height:1.5;color:var(--ink);}
  .confirm-actions{display:flex;justify-content:flex-end;gap:10px;}

  /* ---------- SECCIONES DEL FORMULARIO ---------- */
  .form-section{margin:26px 0 14px;padding-top:16px;border-top:1px dashed var(--line);}
  .form-section h3{
    font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.08em;
    font-size:.8rem;color:var(--steel);margin:0 0 14px;font-weight:600;
  }
  .field .otro-wrap{margin-top:8px;}

  /* ---------- CONFIGURACIÓN ---------- */
  .config-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
  .config-col h3{
    font-family:'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.06em;
    font-size:.95rem;color:var(--ink);margin:0 0 12px;font-weight:700;
  }
  .chip-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;max-height:320px;overflow-y:auto;padding-right:4px;}
  .chip-row{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    background:var(--paper-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:.85rem;
  }
  .chip-row button{
    background:none;border:none;color:var(--alert);font-size:1rem;cursor:pointer;line-height:1;padding:0 4px;font-weight:700;
  }
  .add-row{display:flex;gap:8px;}
  .add-row input{flex:1;}
  .config-empty{font-size:.82rem;color:var(--steel);padding:8px 0;}
  @media (max-width:680px){ .config-grid{grid-template-columns:1fr;} }

  /* ---------- TARJETA SALIDA: INFO EXTRA ---------- */
  .visitante-card .info .extra-info{display:block;font-size:.76rem;color:var(--steel);margin-top:2px;}

  /* ---------- MODAL DETALLE ---------- */
  .detalle-overlay{
    position:fixed;inset:0;background:rgba(28,35,51,.55);display:flex;align-items:center;justify-content:center;
    z-index:90;padding:20px;
  }
  .detalle-box{background:#fff;border-radius:10px;padding:24px;max-width:460px;width:100%;max-height:85vh;overflow-y:auto;border:1px solid var(--line);}
  .detalle-box h3{font-family:'Barlow Condensed',sans-serif;font-size:1.2rem;margin:0 0 4px;font-weight:700;}
  .detalle-box .detalle-sub{font-size:.78rem;color:var(--steel);margin:0 0 16px;}
  .detalle-row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.85rem;}
  .detalle-row span:first-child{color:var(--steel);}
  .detalle-row span:last-child{font-weight:500;text-align:right;}
  .detalle-firma{margin-top:14px;text-align:center;}
  .detalle-firma img{height:70px;border:1px solid var(--line);border-radius:4px;background:#fff;padding:4px;}
  .detalle-close{margin-top:18px;width:100%;}

  @media (max-width:560px){
    .field-row{flex-direction:column;gap:0;}
    .panel{padding:18px;border-radius:8px;}
    .historial-head{flex-direction:column;align-items:stretch;}
  }
</style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="left">
        <img src="/logo.png" alt="Millar" class="topbar-logo">
        <div class="topbar-brand">
          <span class="eyebrow">MES · Control de acceso · SST</span>
          <span class="brand-title">Control de Visitantes</span>
        </div>
      </div>
      <div class="topbar-right">
        <div class="clock-wrap">
          <span class="clock-label">Hoy</span>
          <span id="clockDisplay">—</span>
          <span id="storageModeBadge" class="storage-badge" style="display:none;"></span>
        </div>
        <a href="/" class="btn-volver">← MES</a>
      </div>
    </header>

    <div class="module-bar" id="moduleBar">
      <button class="module-pill" data-action="cambiarModulo" data-modulo="visitantes">👥 Visitantes</button>
      <button class="module-pill" data-action="cambiarModulo" data-modulo="personal">👷 Empleados</button>
    </div>

    <nav class="tabs" id="tabsNav"></nav>

    <main id="view">
      <div class="empty-state"><strong>Cargando…</strong>Conectando con el registro de visitantes.</div>
    </main>
  </div>

  <div class="stamp-overlay" id="stampOverlay">
    <div class="stamp-ring">
      <span class="stamp-check">✓</span>
      <p class="stamp-title" id="stampTitle">INGRESO REGISTRADO</p>
      <p class="stamp-sub" id="stampSub"></p>
    </div>
  </div>

<script>
/* ============================ ESTADO ============================ */
let DB = { perfiles:{}, visitas:[], perfilesPersonal:{}, salidasPersonal:[], config:{ empresaNombre:'', epsList:[], arlList:[], listaPersonal:[] } };
let activeModule = 'visitantes';
let activeTab = 'ingreso';

/* ============================ UTILIDADES ============================ */
function fmtDateTime(d){ return new Intl.DateTimeFormat('es-CO',{dateStyle:'medium',timeStyle:'short'}).format(d); }
function fmtTime(d){ return new Intl.DateTimeFormat('es-CO',{timeStyle:'short'}).format(d); }
function fmtDate(d){ return new Intl.DateTimeFormat('es-CO',{dateStyle:'medium'}).format(d); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function renderSelectConOtro(selectId, otroId, otroWrapId, options, currentValue, placeholder){
  const inList = options.includes(currentValue);
  const isOtro = !!currentValue && !inList;
  const opts = options.map(o => `<option value="${esc(o)}" ${currentValue===o?'selected':''}>${esc(o)}</option>`).join('');
  return `
    <select id="${selectId}" data-otrowrap="${otroWrapId}">
      <option value="">${esc(placeholder)}</option>
      ${opts}
      <option value="${OTRO_VAL}" ${isOtro?'selected':''}>Otra (especificar)</option>
    </select>
    <div class="otro-wrap" id="${otroWrapId}" style="display:${isOtro?'block':'none'}">
      <input id="${otroId}" placeholder="Especifica" value="${isOtro?esc(currentValue):''}">
    </div>`;
}
function resolveEntityValue(selectId, otroId){
  const sel = document.getElementById(selectId);
  if(!sel) return '';
  if(sel.value === OTRO_VAL){
    return document.getElementById(otroId)?.value.trim() || '';
  }
  return sel.value;
}

/* ============================ PERSISTENCIA ============================ */
/* ---------- Capa de almacenamiento: usa window.storage (dentro de Claude)
   y cae automáticamente a localStorage cuando se ejecuta como archivo
   descargado o fuera del entorno de Claude.ai ---------- */
let storageMode = null; // 'cloud' | 'local'

async function probarStorageCloud(){
  try{
    if(!window.storage || typeof window.storage.get !== 'function') return false;
    await window.storage.get(STORAGE_KEY, true);
    return true;
  }catch(e){
    // Si el error es "no encontrado" (clave nueva), igual significa que el backend SÍ responde
    const msg = (e && e.message ? e.message : String(e)).toLowerCase();
    if(msg.includes('not found') || msg.includes('no encontrado') || msg.includes('404')) return true;
    return false;
  }
}

async function loadDB(){
  const cloudOk = await probarStorageCloud();
  storageMode = cloudOk ? 'cloud' : 'local';

  let raw = null;
  try{
    if(storageMode === 'cloud'){
      const res = await window.storage.get(STORAGE_KEY, true);
      raw = res.value;
    } else {
      raw = localStorage.getItem(STORAGE_KEY);
    }
    if(raw == null) throw new Error('sin datos previos');
    DB = JSON.parse(raw);
    if(!DB.config) DB.config = {};
    if(DB.config.empresaNombre === undefined) DB.config.empresaNombre = '';
    if(!Array.isArray(DB.config.epsList)) DB.config.epsList = [...EPS_DEFAULT];
    if(!Array.isArray(DB.config.arlList)) DB.config.arlList = [...ARL_DEFAULT];
    if(!Array.isArray(DB.config.listaPersonal)) DB.config.listaPersonal = [];
    if(!Array.isArray(DB.config.tiposDocumento)) DB.config.tiposDocumento = [...TIPOS_DOC_DEFAULT];
    if(!Array.isArray(DB.config.motivosVisita)) DB.config.motivosVisita = [...MOTIVOS_VISITA_DEFAULT];
    if(!Array.isArray(DB.config.tiposSangre)) DB.config.tiposSangre = [...SANGRE_DEFAULT];
    if(!Array.isArray(DB.config.parentescos)) DB.config.parentescos = [...PARENTESCOS_DEFAULT];
    if(!DB.perfilesPersonal) DB.perfilesPersonal = {};
    if(!Array.isArray(DB.salidasPersonal)) DB.salidasPersonal = [];
    DB.salidasPersonal.forEach(s=>{
      if(!s.estado) s.estado = s.fechaRegreso ? 'regresado' : 'pendiente';
    });
  }catch(e){
    DB = { perfiles:{}, visitas:[], perfilesPersonal:{}, salidasPersonal:[], config:{ empresaNombre:'', epsList:[...EPS_DEFAULT], arlList:[...ARL_DEFAULT], listaPersonal:[], tiposDocumento:[...TIPOS_DOC_DEFAULT], motivosVisita:[...MOTIVOS_VISITA_DEFAULT], tiposSangre:[...SANGRE_DEFAULT], parentescos:[...PARENTESCOS_DEFAULT] } };
    await saveDB();
  }
}

async function saveDB(){
  // Si el modo todavía no se determinó (llamada muy temprana), decide ahora.
  if(storageMode === null){
    storageMode = (await probarStorageCloud()) ? 'cloud' : 'local';
  }
  try{
    if(storageMode === 'cloud'){
      const result = await window.storage.set(STORAGE_KEY, JSON.stringify(DB), true);
      if(!result) throw new Error('sin resultado');
    } else {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
    }
    return true;
  }catch(e){
    console.error('Error guardando registro en modo', storageMode, e);
    // Si falla la nube a mitad de uso, intenta una sola vez con localStorage como respaldo
    if(storageMode === 'cloud'){
      try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
        storageMode = 'local';
        showToast('Se perdió la conexión con el almacenamiento en la nube. Continuando en modo local en este dispositivo.', 'error');
        return true;
      }catch(e2){ /* sigue al mensaje de error genérico abajo */ }
    }
    showToast('No se pudo guardar el registro. Verifica tu conexión e intenta de nuevo.');
    return false;
  }
}

/* ============================ TOAST Y CONFIRMACIÓN ============================ */
function showToast(msg, type='error'){
  let box = document.getElementById('toastBox');
  if(!box){
    box = document.createElement('div');
    box.id = 'toastBox';
    document.body.appendChild(box);
  }
  box.className = `${type} show`;
  box.textContent = msg;
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>{ box.classList.remove('show'); }, 3800);
}
function showConfirm(message){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `
      <div class="confirm-box">
        <p>${esc(message)}</p>
        <div class="confirm-actions">
          <button class="btn btn-ghost" id="confirmCancelBtn">Cancelar</button>
          <button class="btn btn-danger" id="confirmOkBtn">Confirmar</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#confirmCancelBtn').addEventListener('click', ()=>{ overlay.remove(); resolve(false); });
    overlay.querySelector('#confirmOkBtn').addEventListener('click', ()=>{ overlay.remove(); resolve(true); });
  });
}

function showStamp(title, sub){

  overlay.classList.add('show');

/* ============================ FIRMA (CANVAS) ============================ */
function attachSignaturePad(){
  const canvas = document.getElementById('sigCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  function resize(){
    const ratio = Math.max(window.devicePixelRatio||1, 1);
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width*ratio;
    canvas.height = rect.height*ratio;
    ctx.scale(ratio, ratio);
    ctx.lineWidth = 2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle = '#0f172a';
  }
  resize();
  let drawing=false, last=null, hasDrawn=false;
  function pos(e){ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; }
  canvas.addEventListener('pointerdown', e=>{
    drawing=true; last=pos(e); hasDrawn=true;
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', e=>{
    if(!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last = p;
    e.preventDefault();
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>canvas.addEventListener(ev, ()=>{ drawing=false; }));
  currentSigPad = {
    clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); hasDrawn=false; },
    isEmpty(){ return !hasDrawn; },
    toDataURL(){ return canvas.toDataURL('image/png'); }
  };
}

function buscarVisitante(){
  const tipoDoc = document.getElementById('tipoDocSelect').value;
  const numDoc = document.getElementById('numDocInput').value.trim();
  if(!numDoc){
    showFormError('Ingresa el número de documento para continuar.');
    return;
  }
  ingresoUI.tipoDoc = tipoDoc;
  ingresoUI.numDoc = numDoc;
  const perfil = DB.perfiles[numDoc] || null;
  ingresoUI.perfilExistente = perfil;
  ingresoUI.modoFirma = perfil ? 'usarExistente' : 'nueva';
  ingresoUI.step = 'formulario';
  renderView();
}

function showFormError(msg){
  const el = document.getElementById('formError');
  if(el){ el.textContent = msg; el.style.display = 'block'; }
}

async function confirmarIngreso(){
  const nombre = document.getElementById('nombreInput').value.trim();
  const empresa = document.getElementById('empresaInput').value.trim();
  const motivoSel = document.getElementById('motivoSelect').value;
  const motivoOtro = document.getElementById('motivoOtroInput')?.value.trim() || '';
  const motivo = motivoSel === 'Otro' ? (motivoOtro || 'Otro') : motivoSel;
  const area = document.getElementById('areaInput').value.trim();
  const telefono = document.getElementById('telefonoInput').value.trim();
  const placa = document.getElementById('placaInput').value.trim();
  const declarado = document.getElementById('declaracionCheckbox').checked;

  const sangre = document.getElementById('sangreSelect').value;
  const eps = resolveEntityValue('epsSelect','epsOtroInput');
  const arl = resolveEntityValue('arlSelect','arlOtroInput');
  const emergenciaNombre = document.getElementById('emergenciaNombreInput').value.trim();
  const emergenciaCelular = document.getElementById('emergenciaCelularInput').value.trim();
  const emergenciaParentesco = resolveEntityValue('parentescoSelect','parentescoOtroInput');
  const traeEquipo = document.getElementById('traeEquipoCheckbox').checked;
  const equipoDetalle = document.getElementById('equipoDetalleInput')?.value.trim() || '';

  if(!nombre || !empresa || !area){
    showFormError('Completa nombre, empresa y área/persona a visitar.');
    return;
  }
  if(esColumnaDeDocumento(nombre)){
    showFormError('El nombre completo no puede ser solo un número. Verifica que no hayas escrito el documento en el campo de nombre.');
    return;
  }
  if(motivoSel === 'Otro' && !motivoOtro){
    showFormError('Especifica el motivo de la visita.');
    return;
  }
  if(!declarado){
    showFormError('Debes aceptar la declaración de normas de SST para continuar.');
    return;
  }

  let firma = null;
  if(ingresoUI.perfilExistente && ingresoUI.modoFirma === 'usarExistente'){
    firma = ingresoUI.perfilExistente.firma;
  } else if(currentSigPad && !currentSigPad.isEmpty()){
    firma = currentSigPad.toDataURL();
  }
  if(!firma){
    showFormError('Falta la firma. Firma en el recuadro antes de confirmar.');
    return;
  }

  const now = new Date();
  const visita = {
    id: `${now.getTime()}-${ingresoUI.numDoc}`,
    numDoc: ingresoUI.numDoc,
    tipoDoc: ingresoUI.tipoDoc,
    nombre, empresa, motivo, area, telefono, placa,
    sangre, eps, arl, emergenciaNombre, emergenciaCelular, emergenciaParentesco,
    traeEquipo, equipoDetalle: traeEquipo ? equipoDetalle : '',

/* ============================ EXPORTACIÓN A EXCEL ============================ */
async function exportarExcel(headers, rows, nombreHoja, nombreArchivo){
  showToast('Generando archivo Excel…', 'success');
  try{
    await cargarLibreriaExcel();
  }catch(e){
    showToast('No se pudo cargar el generador de Excel. Verifica tu conexión e intenta de nuevo.');
    return;
  }
  try{
    const XLSX = window.XLSX;

    // Construir datos: encabezado + filas
    const datos = [headers, ...rows];
    const ws = XLSX.utils.aoa_to_sheet(datos);

    // Anchos automáticos por columna (máx 50 caracteres)
    ws['!cols'] = headers.map((h, ci) => {
      const maxData = rows.reduce((max, row) => {
        const val = row[ci] != null ? String(row[ci]) : '';
        return Math.max(max, val.length);
      }, 0);
      return { wch: Math.min(50, Math.max(h.length + 2, maxData + 2)) };
    });

    // Congelar fila de encabezado
    ws['!freeze'] = { xSplit: 0, ySplit: 1 };

    // Autofilter
    ws['!autofilter'] = { ref: ws['!ref'] };

    const wb = XLSX.utils.book_new();
    const nombreHojaLimpio = nombreHoja.replace(/[:\\\/\?\*\[\]]/g, '-').slice(0, 31);
    XLSX.utils.book_append_sheet(wb, ws, nombreHojaLimpio);

    // Hoja de información
    const wsInfo = XLSX.utils.aoa_to_sheet([
      ['Campo', 'Valor'],
      ['Empresa', DB.config.empresaNombre || 'Sistema Control de Visitantes SST'],
      ['Fecha de generación', fmtDateTime(new Date())],
      ['Total de registros', rows.length],
    ]);
    wsInfo['!cols'] = [{ wch: 25 }, { wch: 40 }];
    XLSX.utils.book_append_sheet(wb, wsInfo, 'Información');

    // Generar el archivo y descargarlo
    const wbout = XLSX.write(wb, { bookType:'xlsx', type:'array' });
    const blob = new Blob([wbout], { type:'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nombreArchivo;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast(`Excel descargado: ${rows.length} registro${rows.length===1?'':'s'}.`, 'success');
  }catch(err){
    console.error('Error generando Excel:', err);
    showToast('Error al generar el Excel: ' + (err.message || err));
  }
}

let sheetJsCargando = null;
function cargarLibreriaExcel(){
  if(window.XLSX) return Promise.resolve();
  if(sheetJsCargando) return sheetJsCargando;
  sheetJsCargando = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    script.onload = () => resolve();
    script.onerror = () => { sheetJsCargando = null; reject(new Error('No se pudo cargar el lector de Excel')); };
    document.head.appendChild(script);
  });
  return sheetJsCargando;
}
async function handleNominaFile(file){
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const ta = document.getElementById('nominaTextarea');

  if(ext === 'xlsx' || ext === 'xls'){
    showToast('Leyendo archivo de Excel…', 'success');
    try{
      await cargarLibreriaExcel();
    }catch(e){
      showToast('No se pudo cargar el lector de Excel. Verifica tu conexión a internet e intenta de nuevo.');
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const datos = new Uint8Array(ev.target.result);
        const libro = window.XLSX.read(datos, { type:'array' });
        const hoja = libro.Sheets[libro.SheetNames[0]];
        const filas = window.XLSX.utils.sheet_to_json(hoja, { header:1, raw:false, defval:'' });
        const texto = filas
          .map(fila => fila.map(c => String(c==null?'':c).trim()).join(','))
          .filter(linea => linea.replace(/,/g,'').trim() !== '')
          .join('\n');
        if(ta) ta.value = texto;
        showToast('Archivo de Excel leído correctamente. Revisa el texto y pulsa "Cargar a la lista".', 'success');
      }catch(err){
        console.error('Error leyendo Excel', err);
        showToast('No se pudo leer el archivo. Verifica que sea un Excel (.xlsx/.xls) válido.');
      }
    };
    reader.onerror = () => showToast('No se pudo leer el archivo seleccionado.');
    reader.readAsArrayBuffer(file);
  } else {
    const reader = new FileReader();
    reader.onload = (ev)=>{ if(ta) ta.value = ev.target.result; };
    reader.onerror = () => showToast('No se pudo leer el archivo seleccionado.');
    reader.readAsText(file, 'UTF-8');
  }
}
function esColumnaDeDocumento(valor){
  // Considera "documento" si, al quitar espacios y puntos, queda solo dígitos
  // y tiene una longitud razonable de cédula/documento (4 a 15 caracteres).
  const limpio = (valor||'').replace(/[\s.]/g,'');
  return /^[0-9]{4,15}$/.test(limpio);
}
function esFilaEncabezado(valor){
  return /^(nombre|nombres|cedula|c[eé]dula|documento|numdoc|n[uú]mero\s*de\s*documento|identificaci[oó]n)$/i.test((valor||'').trim());
}
function parseListaPersonalTexto(texto){
  const lineas = texto.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const out = [];
  for(const linea of lineas){
    const cols = linea.split(/[,;\t]/).map(c=>c.trim().replace(/^"|"$/g,''));
    if(cols.length < 2) continue;

    const col0 = cols[0] || '';
    const col1 = cols[1] || '';
    if(esFilaEncabezado(col0) || esFilaEncabezado(col1)) continue; // fila de encabezado, en cualquier orden

    // Detecta automáticamente cuál de las dos primeras columnas es el documento
    // (texto puramente numérico) y cuál es el nombre, sin asumir un orden fijo.
    const col0EsDoc = esColumnaDeDocumento(col0);
    const col1EsDoc = esColumnaDeDocumento(col1);
    let nombre, numDoc;
    if(col1EsDoc && !col0EsDoc){
      nombre = col0; numDoc = col1;
    } else if(col0EsDoc && !col1EsDoc){
      nombre = col1; numDoc = col0;
    } else {
      // Ambas o ninguna parecen documento: se asume el orden estándar Nombre, Documento
      nombre = col0; numDoc = col1;
    }
    numDoc = numDoc.replace(/[\s.]/g,'');
    const cargo = cols[2] || '';
    const tipoDocRaw = (cols[3]||'CC').toUpperCase().trim();
    if(!nombre || !numDoc) continue;
    const tipoDocValido = ['CC','CE','PA','TI','PPT'].includes(tipoDocRaw) ? tipoDocRaw : 'CC';
    out.push({ nombre, numDoc, cargo, tipoDoc: tipoDocValido });
  }
  return out;
}
async function cargarListaPersonal(){
  const ta = document.getElementById('nominaTextarea');
  const texto = ta ? ta.value : '';
  const nuevos = parseListaPersonalTexto(texto);
  if(nuevos.length === 0){
    showToast('No se reconoció ningún registro válido. Usa el formato: Nombre, Cédula, Área (opcional)');
    return;
  }
  const mapa = new Map((DB.config.listaPersonal||[]).map(p => [p.numDoc, p]));
  nuevos.forEach(p => mapa.set(p.numDoc, p));
  DB.config.listaPersonal = Array.from(mapa.values()).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const ok = await saveDB();
  if(ok){
    if(ta) ta.value = '';
    const fileInput = document.getElementById('nominaFileInput');
    if(fileInput) fileInput.value = '';
    showToast(`Se cargaron ${nuevos.length} registro(s) a la lista de personal.`, 'success');
    renderView();
  }
}

function resolverPerfilPersonal(numDoc, tipoDocFallback){
  const nomina = (DB.config.listaPersonal||[]).find(p => p.numDoc === numDoc);
  const perfilFirma = DB.perfilesPersonal[numDoc] || null;
  if(nomina){
    // La lista de personal cargada es la fuente oficial de nombre/área/tipo de
    // documento; la firma (si existe) se reutiliza desde registros anteriores.
    return {
      perfil: { nombre: nomina.nombre, cargo: nomina.cargo, tipoDoc: nomina.tipoDoc || tipoDocFallback, firma: perfilFirma ? perfilFirma.firma : null },
      modoFirma: (perfilFirma && perfilFirma.firma) ? 'usarExistente' : 'nueva'
    };
  }
  if(perfilFirma){
    return { perfil: perfilFirma, modoFirma: 'usarExistente' };
  }
  return { perfil: null, modoFirma: 'nueva' };
}

function buscarPersonal(){
  const tipoDoc = document.getElementById('tipoDocSelectP').value;
  const numDoc = document.getElementById('numDocInputP').value.trim();
  if(!numDoc){
    showFormError('Ingresa el número de documento para continuar.');
    return;
  }
  personalUI.numDoc = numDoc;
  const { perfil, modoFirma } = resolverPerfilPersonal(numDoc, tipoDoc);
  personalUI.tipoDoc = perfil?.tipoDoc || tipoDoc;
  personalUI.perfilExistente = perfil;
  personalUI.modoFirma = modoFirma;
  personalUI.step = 'formulario';
  renderView();
}

function buscarEnNomina(query){
  const q = (query||'').trim().toLowerCase();
  if(!q) return [];
  const lista = DB.config.listaPersonal || [];
  return lista
    .filter(p => p.nombre.toLowerCase().includes(q) || p.numDoc.includes(q))
    .slice(0, 8);
}
function renderNominaSuggestions(query){
  const box = document.getElementById('nominaSuggestions');

  const matches = buscarEnNomina(query);
  if(!query.trim()){
    box.classList.remove('show');

  box.classList.add('show');
  if(matches.length === 0){
    box.innerHTML = `<div class="nomina-empty-msg">Sin coincidencias en la lista cargada. Puedes ingresar el documento manualmente abajo.</div>`;

async function confirmarSalidaPersonal(){
  const nombre = document.getElementById('nombreInputP').value.trim();
  const cargo = document.getElementById('cargoInputP').value.trim();
  const motivoSel = document.getElementById('motivoSelectP').value;
  const motivoOtro = document.getElementById('motivoOtroInputP')?.value.trim() || '';
  const motivo = motivoSel === 'Otro' ? (motivoOtro || 'Otro') : motivoSel;
  const destino = document.getElementById('destinoInputP').value.trim();
  const horaRegresoEst = document.getElementById('horaRegresoEstInputP').value;
  const observaciones = document.getElementById('observacionesInputP').value.trim();
  const autorizaNombre = document.getElementById('autorizaInputP').value.trim();
  const autorizaArea = document.getElementById('autorizaAreaInputP').value.trim();

  if(!nombre || !destino){
    showFormError('Completa el nombre y el destino de la salida.');
    return;
  }
  if(esColumnaDeDocumento(nombre)){
    showFormError('El nombre completo no puede ser solo un número. Verifica que no hayas escrito la cédula en el campo de nombre.');
    return;
  }
  if(!autorizaNombre){
    showFormError('Indica el nombre de quien autoriza la salida.');
    return;
  }
  if(esColumnaDeDocumento(autorizaNombre)){
    showFormError('El nombre de quien autoriza no puede ser solo un número.');
    return;
  }
  if(motivoSel === 'Otro' && !motivoOtro){
    showFormError('Especifica el motivo de la salida.');
    return;
  }

  let firma = null;
  if(personalUI.perfilExistente && personalUI.modoFirma === 'usarExistente'){
    firma = personalUI.perfilExistente.firma;
  } else if(currentSigPad && !currentSigPad.isEmpty()){
    firma = currentSigPad.toDataURL();
  }
  if(!firma){
    showFormError('Falta la firma. Firma en el recuadro antes de confirmar.');
    return;
  }

  const now = new Date();
  const salida = {
    id: `${now.getTime()}-${personalUI.numDoc}`,
    numDoc: personalUI.numDoc,
    tipoDoc: personalUI.tipoDoc,
    nombre, cargo, motivo, destino, horaRegresoEst, observaciones,
    autorizaNombre, autorizaArea,
    fechaSalida: now.toISOString(),
    fechaRegreso: null,
    estado: 'pendiente',
    firma
  };
  DB.salidasPersonal.push(salida);
  DB.perfilesPersonal[personalUI.numDoc] = { nombre, cargo, tipoDoc: personalUI.tipoDoc, firma };

  // Si la persona no estaba en la lista de personal cargada, recepción la acaba de
  // dar de alta: se agrega automáticamente para que quede disponible en el buscador.
  // Si ya existía, se actualizan sus datos por si fueron corregidos en este registro.
  DB.config.listaPersonal = DB.config.listaPersonal || [];
  const idxNomina = DB.config.listaPersonal.findIndex(p => p.numDoc === personalUI.numDoc);
  let esPersonaNueva = false;
  if(idxNomina === -1){
    DB.config.listaPersonal.push({ nombre, numDoc: personalUI.numDoc, cargo, tipoDoc: personalUI.tipoDoc });
    DB.config.listaPersonal.sort((a,b)=>a.nombre.localeCompare(b.nombre));
    esPersonaNueva = true;
  } else {
    DB.config.listaPersonal[idxNomina] = { nombre, numDoc: personalUI.numDoc, cargo, tipoDoc: personalUI.tipoDoc };
  }

  const ok = await saveDB();
  if(!ok) return;

  showStamp('SALIDA REGISTRADA', `${esc(nombre).slice(0,30)} · ${fmtTime(now)}`);
  personalUI = { step:'buscar', numDoc:'', tipoDoc:'CC', perfilExistente:null, modoFirma:'nueva' };
  setTimeout(()=>{
    renderView();
    if(esPersonaNueva){
      showToast(`${nombre} se agregó a la lista de personal para futuras búsquedas.`, 'success');
    }
  }, 350);
}

/* ============================ CIERRE AUTOMÁTICO DE PENDIENTES VENCIDOS ============================ */
async function cerrarPendientesVencidos(){
  const hoyStr = new Date().toISOString().slice(0,10);
  let huboCambios = false;
  (DB.salidasPersonal||[]).forEach(s => {
    if(s.estado === 'pendiente' && s.tipo !== 'entrada_externa' && s.fechaSalida.slice(0,10) !== hoyStr){
      s.estado = 'no_regreso';
      s.fechaCierreAutomatico = new Date().toISOString();
      huboCambios = true;
    }
  });
  if(huboCambios){
    await saveDB();
  }
  return huboCambios;
}

function historialPersonalFiltrado(textoF, fechaF){
  const t = (textoF||'').toLowerCase();
  return DB.salidasPersonal
    .filter(s => !t || s.nombre.toLowerCase().includes(t) || s.numDoc.includes(t) || s.destino.toLowerCase().includes(t))
    .filter(s => !fechaF || s.fechaSalida.slice(0,10) === fechaF)
    .sort((a,b)=> new Date(b.fechaSalida) - new Date(a.fechaSalida));
}

function renderNominaSuggestionsEntrada(query){
  const box = document.getElementById('nominaSuggestionsE');
  if(!box) return;
  const q = (query||'').trim();
  if(!q){ box.classList.remove('show'); box.innerHTML=''; return; }
  const matches = (DB.config.listaPersonal||[])
    .filter(p => p.nombre.toLowerCase().includes(q.toLowerCase()) || p.numDoc.includes(q))
    .slice(0,8);
  box.classList.add('show');
  if(matches.length === 0){
    box.innerHTML = `<div class="nomina-empty-msg">Sin coincidencias. Puedes ingresar el documento manualmente.</div>`;
    return;
  }
  box.innerHTML = matches.map(p => `
    <div class="nomina-item" data-action="seleccionarNominaEntrada" data-numdoc="${esc(p.numDoc)}" data-tipodoc="${esc(p.tipoDoc||'CC')}">
      <span>${esc(p.nombre)}${p.cargo?' · '+esc(p.cargo):''}</span>
      <span class="nm-doc">${esc(p.numDoc)}</span>
    </div>`).join('');
}

async function confirmarEntradaExterna(){
  const nombre       = document.getElementById('nombreInputE').value.trim();
  const cargo        = document.getElementById('cargoInputE').value.trim();
  const motivoSel    = document.getElementById('motivoSelectE').value;
  const motivoOtro   = document.getElementById('motivoOtroInputE')?.value.trim() || '';
  const motivo       = motivoSel === 'Otro' ? (motivoOtro||'Otro') : motivoSel;
  const origen       = document.getElementById('origenInputE').value.trim();
  const observaciones= document.getElementById('observacionesInputE').value.trim();

  if(!nombre || !origen){ showFormError('Completa el nombre y el lugar de origen.'); return; }
  if(esColumnaDeDocumento(nombre)){ showFormError('El nombre no puede ser solo un número.'); return; }
  if(motivoSel === 'Otro' && !motivoOtro){ showFormError('Especifica el motivo.'); return; }

  let firma = null;
  if(entradaUI.perfilExistente && entradaUI.modoFirma === 'usarExistente'){
    firma = entradaUI.perfilExistente.firma;
  } else if(currentSigPad && !currentSigPad.isEmpty()){
    firma = currentSigPad.toDataURL();
  }
  if(!firma){ showFormError('Falta la firma. Firma en el recuadro antes de confirmar.'); return; }

  const now = new Date();
  const registro = {
    id: `${now.getTime()}-${entradaUI.numDoc}`,
    tipo: 'entrada_externa',
    numDoc: entradaUI.numDoc,
    tipoDoc: entradaUI.tipoDoc,
    nombre, cargo, motivo,
    destino: origen,           // reutilizamos el campo "destino" para el lugar de origen
    observaciones,
    autorizaNombre: '', autorizaArea: '', horaRegresoEst: '',
    fechaSalida: now.toISOString(),   // hora de llegada (reutilizamos fechaSalida como referencia)
    fechaRegreso: now.toISOString(),  // ya está en la empresa al registrar
    estado: 'entrada_externa',
    firma
  };
  DB.salidasPersonal.push(registro);

  // Actualizar perfil y nómina
  DB.perfilesPersonal[entradaUI.numDoc] = { nombre, cargo, tipoDoc: entradaUI.tipoDoc, firma };
  DB.config.listaPersonal = DB.config.listaPersonal || [];
  const idx = DB.config.listaPersonal.findIndex(p => p.numDoc === entradaUI.numDoc);
  if(idx === -1){
    DB.config.listaPersonal.push({ nombre, numDoc: entradaUI.numDoc, cargo, tipoDoc: entradaUI.tipoDoc });
    DB.config.listaPersonal.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  } else {
    DB.config.listaPersonal[idx] = { nombre, numDoc: entradaUI.numDoc, cargo, tipoDoc: entradaUI.tipoDoc };
  }

  const ok = await saveDB();
  if(!ok) return;
  showStamp('LLEGADA REGISTRADA', `${esc(nombre).slice(0,30)} · ${fmtTime(now)}`);
  entradaUI = { step:'buscar', numDoc:'', tipoDoc:'CC', perfilExistente:null, modoFirma:'nueva' };
  setTimeout(renderView, 350);
}

  } else if(e.target.id === 'buscarNominaInputE'){
    setTimeout(()=>{ const b=document.getElementById('nominaSuggestionsE'); if(b) b.classList.remove('show'); }, 180);
  } else if(e.target.id === 'autorizaInputP'){
    setTimeout(()=>{ const b=document.getElementById('autorizaSuggestions'); if(b) b.classList.remove('show'); }, 180);
  }
});
document.getElementById('app').addEventListener('change', (e)=>{
  if(e.target.id === 'nominaFileInput'){

    if(!file) return;
    handleNominaFile(file);

});
document.getElementById('app').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && e.target.id === 'numDocInput'){

  } else if(e.key === 'Enter' && e.target.id === 'numDocInputP'){

document.getElementById('app').addEventListener('change', (e)=>{
  if(e.target.id === 'motivoSelect'){

/* ============================ INICIO ============================ */
async function init(){
  tickClock();
  renderView();
  await loadDB();
  const badge = document.getElementById('storageModeBadge');
  if(badge){
    badge.style.display = 'inline-block';
    if(storageMode === 'cloud'){
      badge.className = 'storage-badge cloud';
      badge.textContent = '☁ Datos compartidos (nube)';
    } else {
      badge.className = 'storage-badge local';
      badge.textContent = '💾 Datos solo en este dispositivo';
    }
  }
  const huboCierres = await cerrarPendientesVencidos();
  renderView();
  if(huboCierres){
    showToast('Se cerraron automáticamente salidas pendientes de días anteriores como "No regresó".', 'error');
  }
  // Revisa periódicamente (cada 5 min) mientras la app sigue abierta, y refresca
  // la vista de Regreso/Historial si hubo cambios. Nota: este cierre automático
  // solo se ejecuta mientras alguien tiene la app abierta; no corre en segundo
  // plano si nadie la tiene abierta ese día.
  setInterval(async ()=>{
    const cambios = await cerrarPendientesVencidos();
    if(cambios && (activeTab === 'regresoPersonal' || activeTab === 'historialPersonal')){
      renderView();
    }
  }, 5 * 60 * 1000);
}
/* Convertir a mayúsculas todos los campos marcados con uc-field */
document.addEventListener('input', e => {
  if(e.target.classList.contains('uc-field')){
    const pos = e.target.selectionStart;
    e.target.value = e.target.value.toUpperCase();
    try{ e.target.setSelectionRange(pos, pos); }catch(_){}
  }
});

init();
</script>
