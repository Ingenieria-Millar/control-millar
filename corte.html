<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>/* millar-auth: adjunta token de sesión a fetch y WebSocket (transparente si no hay token) */
(function(){function T(){try{var s=JSON.parse(localStorage.getItem('cm_session')||'{}');return s&&s.token||'';}catch(e){return '';}}
var F=window.fetch;window.fetch=function(u,o){o=o||{};var t=T();if(t){var h=new Headers(o.headers||{});if(!h.has('Authorization'))h.set('Authorization','Bearer '+t);o.headers=h;}return F.call(this,u,o);};
var W=window.WebSocket;function MW(u,p){try{var t=T();if(t&&typeof u==='string'&&u.indexOf('token=')<0){u+=(u.indexOf('?')<0?'?':'&')+'token='+encodeURIComponent(t);}}catch(e){}return p!==undefined?new W(u,p):new W(u);}MW.prototype=W.prototype;MW.CONNECTING=W.CONNECTING;MW.OPEN=W.OPEN;MW.CLOSING=W.CLOSING;MW.CLOSED=W.CLOSED;window.WebSocket=MW;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corte — MES | Millar</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Nunito',sans-serif;background:#f1f5f9;color:#0f172a;}
header{background:#fff;border-bottom:1px solid #e2e8f0;box-shadow:0 1px 6px rgba(0,0,0,.06);padding:0 clamp(12px,2.5vw,24px);min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;}
header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#1e3a8a,#2563eb,#60a5fa);}
.hd-brand{display:flex;align-items:center;gap:12px;}
.hd-logo{width:42px;height:42px;border-radius:8px;background:#1e3a8a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.hd-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;letter-spacing:.5px;color:#0f172a;}
.hd-sub{font-size:11px;color:#64748b;font-weight:600;margin-top:1px;}
.hd-right{display:flex;align-items:center;gap:14px;}
.hd-user{font-size:13px;color:#334155;font-weight:700;}
.hd-back{padding:8px 16px;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;color:#475569;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;}
.hd-back:hover{background:#f8fafc;}

.wrap{max-width:1000px;margin:0 auto;padding:24px clamp(12px,2.5vw,24px);}
.toolbar{display:flex;align-items:flex-end;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.toolbar .field{margin-bottom:0;}
.field label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#64748b;display:block;margin-bottom:6px;}
.field input,.field select{padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;font-family:'Nunito',sans-serif;outline:none;}
.field input:focus,.field select:focus{border-color:#2563eb;}
.btn{padding:10px 18px;border-radius:8px;border:none;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.3px;}
.btn-primary{background:#1e3a8a;color:#fff;}
.btn-primary:hover{background:#1e40af;}
.btn-primary:disabled{background:#cbd5e1;cursor:not-allowed;}
.btn-outline{background:#fff;border:1.5px solid #e2e8f0;color:#475569;}
.btn-outline:hover{background:#f8fafc;}
.btn-gen{background:#4338ca;color:#fff;margin-left:auto;}
.btn-gen:hover{background:#3730a3;}
.hint{font-size:12px;color:#94a3b8;margin-top:6px;}
.empty{color:#94a3b8;font-size:13px;text-align:center;padding:40px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}
.toast.error{background:#dc2626;}

/* ── Tarjetas de solicitud, estilo recibo ── */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
.sc{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;}
.sc-top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #f1f5f9;}
.sc-title{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;color:#0f172a;}
.sc-pill{display:inline-flex;padding:4px 12px;border-radius:20px;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;}
.sc-pill.pendiente{background:#fef3c7;color:#92400e;}
.sc-pill.entregada{background:#dbeafe;color:#1d4ed8;}
.sc-pill.aceptada{background:#dcfce7;color:#15803d;}
.sc-cols{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid #f1f5f9;}
.sc-cols>div{padding:8px 10px;border-right:1px solid #f1f5f9;}
.sc-cols>div:last-child{border-right:none;}
.sc-lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#94a3b8;}
.sc-val{font-size:13px;font-weight:700;color:#0f172a;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sc-row{display:flex;align-items:center;justify-content:space-between;padding:7px 14px;border-bottom:1px solid #f8fafc;font-size:12.5px;}
.sc-row .sc-lbl{margin-top:0;}
.sc-row .sc-val{font-size:12.5px;font-weight:600;margin-top:0;}
.sc-row .sc-val.strong{font-weight:800;color:#1e3a8a;}
.sc-bottom{padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sc-status-txt{font-size:11.5px;color:#94a3b8;flex:1;}
.sc-bottom .btn{flex:1;padding:9px;font-size:12.5px;}

/* ── Modal del asistente ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:1000;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:14px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-hd{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #e2e8f0;}
.modal-hd-title{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:800;color:#0f172a;}
.modal-x{border:none;background:none;font-size:18px;color:#94a3b8;cursor:pointer;}
.modal-body{padding:20px;}
.w-resumen{display:flex;align-items:center;justify-content:space-between;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;}
.w-resumen b{color:#1e3a8a;}
.w-resumen a{font-size:12px;color:#2563eb;cursor:pointer;font-weight:700;text-decoration:none;}
.w-lotes-list,.w-rollos-list{margin-top:8px;display:flex;flex-direction:column;gap:6px;max-height:240px;overflow-y:auto;}
.w-opt{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:8px;cursor:pointer;font-size:13px;}
.w-opt:hover{border-color:#93c5fd;background:#eff6ff;}
.w-opt b{color:#1e3a8a;}
.w-opt span{color:#64748b;font-size:12px;}
.w-confirm-card{background:#eff6ff;border:1.5px solid #bfdbfe;border-radius:10px;padding:14px;margin-bottom:16px;}
.w-confirm-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;}
.w-confirm-row b{color:#0f172a;}
</style>
</head>
<body>

<header>
  <div class="hd-brand">
    <div class="hd-logo">✂️</div>
    <div><div class="hd-title">Corte</div><div class="hd-sub">Solicitud de telas a Revisión de Telas</div></div>
  </div>
  <div class="hd-right">
    <div class="hd-user" id="hd-user">—</div>
    <a class="hd-back" href="/">← Volver</a>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <div class="field">
      <label>Filtrar por fecha</label>
      <input type="date" id="c-mias-fecha" oninput="corteCargarMias()">
    </div>
    <button class="btn btn-outline" onclick="document.getElementById('c-mias-fecha').value='';corteCargarMias()">Quitar filtro</button>
    <button class="btn btn-gen" onclick="corteAbrirWizard()">➕ Generar Solicitud</button>
  </div>
  <div id="c-mis-list" class="cards-grid"></div>
</div>

<!-- Asistente para generar una solicitud -->
<div class="modal-overlay" id="c-wizard-overlay">
  <div class="modal-box">
    <div class="modal-hd">
      <div class="modal-hd-title">➕ Generar Solicitud</div>
      <button class="modal-x" onclick="corteCerrarWizard()">✕</button>
    </div>
    <div class="modal-body">

      <!-- Paso 1: elegir lote -->
      <div id="w-step-lote">
        <div class="field">
          <label>N° de Lote</label>
          <input type="text" id="w-lote-input" placeholder="Ej: 56" oninput="corteWBuscarLotes()">
        </div>
        <div id="w-lotes-msg" class="hint"></div>
        <div id="w-lotes-list" class="w-lotes-list"></div>
      </div>
      <div id="w-resumen-lote" class="w-resumen" style="display:none;">
        <span>Lote: <b id="w-lote-elegido"></b></span>
        <a onclick="corteWVolverLote()">‹ Cambiar</a>
      </div>

      <!-- Paso 2: elegir rollo -->
      <div id="w-step-rollo" style="display:none;">
        <div class="field"><label>Rollo</label></div>
        <div id="w-rollos-list" class="w-rollos-list"></div>
      </div>
      <div id="w-resumen-rollo" class="w-resumen" style="display:none;">
        <span>Rollo: <b id="w-rollo-elegido"></b></span>
        <a onclick="corteWVolverRollo()">‹ Cambiar</a>
      </div>

      <!-- Paso 3+4: confirmación + metros -->
      <div id="w-step-final" style="display:none;">
        <div class="w-confirm-card" id="w-confirm-card"></div>
        <div class="field">
          <label>Metros que necesita</label>
          <input type="number" id="w-metros" min="0" step="0.1" placeholder="Ej: 20">
        </div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-primary" id="w-btn-enviar" onclick="corteWEnviar()" style="flex:1;">Solicitar</button>
          <button class="btn btn-outline" onclick="corteCerrarWizard()" style="flex:1;">Cancelar</button>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="c-toast"></div>

<script>
let _cUser='', ws=null;
let _wDatos=null;        // cache de /api/revision-telas mientras el asistente está abierto
let _wLote=null;         // lote elegido (string) o null
let _wRollos=[];         // rollos disponibles del lote elegido
let _wRolloSel=null;     // rollo elegido (objeto) o null

function corteToast(msg,type){
  const t=document.getElementById('c-toast');
  t.textContent=msg; t.className='toast show'+(type==='error'?' error':'');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),3000);
}

function corteInit(){
  try{
    const ses=JSON.parse(localStorage.getItem('cm_session')||'{}');
    _cUser=ses.user||'';
  }catch(e){}
  if(!_cUser){ window.location.href='/'; return; }
  document.getElementById('hd-user').textContent=_cUser;
  corteCargarMias();
  corteConnectWS();
  setInterval(corteCargarMias,60000); // refresca el contador de tiempo de las tarjetas activas
}

// ── Tarjetas (pantalla principal) ───────────────────────────────────
function corteFormatDuracion(ms){
  if(ms<0)ms=0;
  const totalMin=Math.floor(ms/60000);
  const h=Math.floor(totalMin/60), m=totalMin%60;
  if(h>0) return h+'h '+m+'min';
  if(totalMin>0) return totalMin+' min';
  return Math.floor(ms/1000)+' seg';
}
function corteContadorTexto(s){
  if(!s.ts) return '—';
  const fin=s.estado==='aceptada'&&s.tsAceptada?s.tsAceptada:Date.now();
  return corteFormatDuracion(fin-s.ts);
}
async function corteCargarMias(){
  const el=document.getElementById('c-mis-list');
  try{
    const res=await fetch('/api/corte-solicitudes?solicitadoPor='+encodeURIComponent(_cUser));
    let data=await res.json();
    const fechaFiltro=document.getElementById('c-mias-fecha').value;
    if(fechaFiltro) data=data.filter(s=>s.fecha===fechaFiltro);
    if(!data.length){ el.innerHTML='<div class="empty">'+(fechaFiltro?'No hay solicitudes en esa fecha.':'Aún no has hecho ninguna solicitud. Usa "Generar Solicitud" para pedir un rollo.')+'</div>'; return; }
    el.innerHTML=data.map(s=>{
      const statusTxt=s.estado==='pendiente'?'Esperando que Telas entregue el rollo'
        :s.estado==='entregada'?'Telas ya lo entregó — confirma que lo recibiste':'Solicitud cerrada';
      const accion=s.estado==='entregada'
        ?`<button class="btn btn-primary" onclick="corteAceptar('${s.id}')">✔ Aceptar</button>`:'';
      return `<div class="sc">
        <div class="sc-top">
          <div class="sc-title">Lote ${s.lote}</div>
          <span class="sc-pill ${s.estado}">${s.estado}</span>
        </div>
        <div class="sc-cols">
          <div><div class="sc-lbl">Rollo</div><div class="sc-val">#${s.rollo||'—'}</div></div>
          <div><div class="sc-lbl">Metros</div><div class="sc-val">${s.metros}</div></div>
        </div>
        <div class="sc-row"><span class="sc-lbl">Hora solicitud</span><span class="sc-val">${s.fecha} ${s.hora||''}</span></div>
        <div class="sc-row"><span class="sc-lbl">Hora aceptada</span><span class="sc-val">${s.estado==='aceptada'?(s.fechaAceptada||''):'—'}</span></div>
        <div class="sc-row"><span class="sc-lbl">T. Espera</span><span class="sc-val strong">${corteContadorTexto(s)}</span></div>
        <div class="sc-bottom">
          <span class="sc-status-txt">${statusTxt}</span>
          ${accion}
        </div>
      </div>`;
    }).join('');
  }catch(e){
    el.innerHTML='<div class="empty">No se pudieron cargar tus solicitudes.</div>';
  }
}
async function corteAceptar(id){
  try{
    const res=await fetch('/api/corte-solicitudes/'+id+'/aceptar',{method:'POST'});
    if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.error||'Error'); }
    corteToast('✅ Solicitud aceptada');
    corteCargarMias();
  }catch(e){
    corteToast('⚠️ '+e.message,'error');
  }
}

// ── Asistente de 5 pasos (crear solicitud) ──────────────────────────
async function corteAbrirWizard(){
  _wLote=null; _wRollos=[]; _wRolloSel=null;
  document.getElementById('w-lote-input').value='';
  document.getElementById('w-lotes-list').innerHTML='';
  document.getElementById('w-lotes-msg').textContent='Escribe parte del número de lote…';
  document.getElementById('w-metros').value='';
  corteWMostrarPaso();
  document.getElementById('c-wizard-overlay').classList.add('show');
  try{
    const res=await fetch('/api/revision-telas');
    _wDatos=await res.json();
  }catch(e){ _wDatos={registros:[],referencias:{}}; }
  document.getElementById('w-lote-input').focus();
}
function corteCerrarWizard(){
  document.getElementById('c-wizard-overlay').classList.remove('show');
}
// Muestra solo el paso que corresponde según el estado actual, y colapsa
// los pasos ya completados a un resumen con "‹ Cambiar".
function corteWMostrarPaso(){
  document.getElementById('w-step-lote').style.display=_wLote?'none':'block';
  document.getElementById('w-resumen-lote').style.display=_wLote?'flex':'none';
  if(_wLote) document.getElementById('w-lote-elegido').textContent=_wLote;

  document.getElementById('w-step-rollo').style.display=(_wLote&&!_wRolloSel)?'block':'none';
  document.getElementById('w-resumen-rollo').style.display=_wRolloSel?'flex':'none';
  if(_wRolloSel) document.getElementById('w-rollo-elegido').textContent='#'+(_wRolloSel.rollo||'—');

  document.getElementById('w-step-final').style.display=_wRolloSel?'block':'none';
  if(_wRolloSel){
    document.getElementById('w-confirm-card').innerHTML=`
      <div class="w-confirm-row"><span>Lote</span><b>${_wRolloSel.lote}</b></div>
      <div class="w-confirm-row"><span>Rollo</span><b>#${_wRolloSel.rollo||'—'}</b></div>
      <div class="w-confirm-row"><span>Referencia</span><b>${_wRolloSel.referencia||'Sin referencia'}</b></div>
      <div class="w-confirm-row"><span>Metros disponibles</span><b>${_wRolloSel.metros||'—'} m</b></div>`;
    document.getElementById('w-metros').focus();
  }
}
function corteWBuscarLotes(){
  const texto=(document.getElementById('w-lote-input').value||'').trim().toLowerCase();
  const msgEl=document.getElementById('w-lotes-msg');
  const listEl=document.getElementById('w-lotes-list');
  listEl.innerHTML='';
  if(!texto){ msgEl.textContent='Escribe parte del número de lote…'; return; }
  if(!_wDatos){ msgEl.textContent='Cargando datos…'; return; }
  const lotes=new Set();
  (_wDatos.registros||[]).forEach(r=>{
    if(r.finalizado&&r.resultado==='aprobado'&&r.tipo!=='multitarea'&&(r.lote||'').toString().toLowerCase().includes(texto)) lotes.add(r.lote);
  });
  Object.values(_wDatos.referencias||{}).forEach(arr=>(arr||[]).forEach(ref=>{
    if(typeof ref==='object'&&(ref.lote||'').toString().toLowerCase().includes(texto)) lotes.add(ref.lote);
  }));
  const listaLotes=[...lotes].sort();
  if(!listaLotes.length){ msgEl.textContent='No se encontraron lotes que coincidan con "'+texto+'".'; return; }
  msgEl.textContent=listaLotes.length+' lote(s) encontrados:';
  listEl.innerHTML=listaLotes.map(l=>`
    <div class="w-opt" onclick="corteWElegirLote('${l.replace(/'/g,"\\'")}')"><span>Lote <b>${l}</b></span></div>`).join('');
}
function corteWElegirLote(lote){
  _wLote=lote;
  const deRevision=(_wDatos.registros||[]).filter(r=>
    r.lote===lote && r.finalizado && r.resultado==='aprobado' && r.tipo!=='multitarea'
  ).map(r=>({lote:r.lote,rollo:r.rollo,referencia:r.referencia,metros:r.metros}));
  const deReferencias=[];
  Object.values(_wDatos.referencias||{}).forEach(arr=>(arr||[]).forEach(ref=>{
    if(typeof ref==='object'&&ref.lote===lote){
      deReferencias.push({lote:ref.lote,rollo:ref.rollo,referencia:ref.referencia,metros:ref.mts});
    }
  }));
  const vistos=new Set(deRevision.map(r=>r.rollo));
  _wRollos=[...deRevision, ...deReferencias.filter(r=>!vistos.has(r.rollo))];
  document.getElementById('w-rollos-list').innerHTML=_wRollos.map((r,i)=>`
    <div class="w-opt" onclick="corteWElegirRollo(${i})">
      <span>Rollo <b>#${r.rollo||'—'}</b> — ${r.referencia||'Sin referencia'}</span>
      <span>${r.metros||'—'} m disponibles</span>
    </div>`).join('')||'<div class="hint">Este lote no tiene rollos disponibles.</div>';
  corteWMostrarPaso();
}
function corteWVolverLote(){
  _wLote=null; _wRollos=[]; _wRolloSel=null;
  corteWMostrarPaso();
  document.getElementById('w-lote-input').focus();
}
function corteWElegirRollo(i){
  _wRolloSel=_wRollos[i];
  corteWMostrarPaso();
}
function corteWVolverRollo(){
  _wRolloSel=null;
  corteWMostrarPaso();
}
async function corteWEnviar(){
  if(!_wRolloSel){ corteToast('Selecciona un rollo primero','error'); return; }
  const metros=(document.getElementById('w-metros').value||'').trim();
  if(!metros||parseFloat(metros)<=0){ corteToast('Escribe cuántos metros necesitas','error'); return; }
  const btn=document.getElementById('w-btn-enviar');
  btn.disabled=true;
  try{
    const res=await fetch('/api/corte-solicitudes',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({lote:_wRolloSel.lote,rollo:_wRolloSel.rollo,metros,solicitadoPor:_cUser})});
    if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.error||'Error al enviar'); }
    corteToast('✅ Solicitud enviada a Revisión de Telas');
    corteCerrarWizard();
    corteCargarMias();
  }catch(e){
    corteToast('⚠️ '+e.message,'error');
  }finally{
    btn.disabled=false;
  }
}

function corteConnectWS(){
  if(!location.host) return;
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(proto+'://'+location.host);
  ws.onopen=()=>{ ws.send(JSON.stringify({type:'subscribe',topics:['corte']})); };
  ws.onmessage=e=>{
    try{
      const msg=JSON.parse(e.data);
      if((msg.type==='corte_new_request'||msg.type==='corte_update_request') && msg.solicitud && msg.solicitud.solicitadoPor===_cUser){
        corteCargarMias();
        if(msg.type==='corte_update_request'&&msg.solicitud.estado==='entregada'){
          corteToast('📦 Tu solicitud del lote '+msg.solicitud.lote+' fue marcada como entregada');
        }
      }
    }catch(err){}
  };
  ws.onclose=()=>{ setTimeout(corteConnectWS,4000); };
  ws.onerror=()=>ws.close();
}

corteInit();
</script>
</body>
</html>
