<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>/* millar-auth: adjunta token de sesión a fetch y WebSocket (transparente si no hay token) */
(function(){function T(){try{var s=JSON.parse(localStorage.getItem('cm_session')||'{}');return s&&s.token||'';}catch(e){return '';}}
var F=window.fetch;window.fetch=function(u,o){o=o||{};var t=T();if(t){var h=new Headers(o.headers||{});if(!h.has('Authorization'))h.set('Authorization','Bearer '+t);o.headers=h;}return F.call(this,u,o);};
var W=window.WebSocket;function MW(u,p){try{var t=T();if(t&&typeof u==='string'&&u.indexOf('token=')<0){u+=(u.indexOf('?')<0?'?':'&')+'token='+encodeURIComponent(t);}}catch(e){}return p!==undefined?new W(u,p):new W(u);}MW.prototype=W.prototype;MW.CONNECTING=W.CONNECTING;MW.OPEN=W.OPEN;MW.CLOSING=W.CLOSING;MW.CLOSED=W.CLOSED;window.WebSocket=MW;})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hoja de Vida — Confecciones Millar</title>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Nunito:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5f9;--panel:#fff;--border:#e2e8f0;--text:#0f172a;--muted:#64748b;--blue:#2563eb;--blue-dark:#1e3a8a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);font-family:'Nunito',sans-serif;color:var(--text);min-height:100vh;}
header{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 24px;min-height:64px;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 1px 6px rgba(0,0,0,.07);gap:12px;}
header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#1e3a8a,#2563eb,#60a5fa);}
.hd-left{display:flex;align-items:center;gap:12px;}
.hd-logo{width:46px;height:46px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 2px #e2e8f0,0 2px 8px rgba(0,0,0,.1);}
.hd-logo img{width:100%;height:100%;object-fit:contain;padding:3px;}
.hd-title{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#0f172a;line-height:1;}
.hd-title span{color:#2563eb;}
.hd-date{font-size:12px;color:#64748b;font-weight:600;margin-top:2px;}
.hd-right{display:flex;align-items:center;gap:8px;}
.btn-volver{padding:7px 16px;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;color:#1e3a8a;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.5px;cursor:pointer;height:36px;display:flex;align-items:center;transition:all .2s;}
.btn-volver:hover{background:#f1f5f9;}
.btn-primary{padding:7px 18px;border-radius:8px;border:none;background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.5px;cursor:pointer;height:36px;display:flex;align-items:center;gap:6px;transition:all .2s;}
.btn-primary:hover{filter:brightness(1.1);}

main{padding:20px 24px;}

/* PANTALLAS */
.screen{display:none;}
.screen.active{display:block;}

/* TABLE PANEL */
.table-panel{background:#fff;border-radius:16px;border:1.5px solid #e2e8f0;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.05);}
.table-panel table{width:100%;table-layout:fixed;font-size:12px;border-collapse:collapse;}
.table-panel th{background:#f8fafc;padding:10px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;border-bottom:1.5px solid #e2e8f0;}
.table-panel td{padding:10px 12px;border-bottom:1px solid #f1f5f9;color:#334155;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.table-panel tr:last-child td{border-bottom:none;}
.table-panel tr:hover td{background:#f8fafc;}
.filter-input{width:100%;padding:4px 8px;border:1px solid #e2e8f0;border-radius:6px;font-size:11px;font-family:'Nunito',sans-serif;color:#334155;outline:none;box-sizing:border-box;}
.filter-input:focus{border-color:#2563eb;}
.btn-ver{padding:4px 12px;border-radius:8px;border:none;background:#eff6ff;color:#1e40af;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.5px;cursor:pointer;border:1px solid #93c5fd;transition:all .2s;}
.btn-ver:hover{background:#dbeafe;}

/* KPIs */
.kpis-row{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
.kpi{background:#fff;border-radius:12px;padding:16px 20px;flex:1;min-width:120px;max-width:180px;border:1px solid transparent;}
.kpi-val{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;line-height:1;}
.kpi-lbl{font-size:10px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-top:4px;}

/* RANKING */
.ranking-card{background:#fff;border-radius:16px;border:1.5px solid #e2e8f0;padding:20px 24px;margin-bottom:20px;box-shadow:0 1px 6px rgba(0,0,0,.05);}
.ranking-title{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;color:#0f172a;margin-bottom:14px;}
.rank-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9;}
.rank-row:last-child{border-bottom:none;}
.rank-pos{width:24px;height:24px;border-radius:50%;background:#eff6ff;color:#1e40af;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rank-bar-wrap{flex:1;}
.rank-nombre{font-size:12px;font-weight:600;color:#0f172a;margin-bottom:3px;}
.rank-bar{height:6px;border-radius:3px;background:#dbeafe;}
.rank-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#1e3a8a,#2563eb);transition:width .6s ease;}
.rank-count{font-size:12px;font-weight:700;color:#2563eb;flex-shrink:0;}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.badge-prev{background:#fef9c3;color:#a16207;}
.badge-corr{background:#fee2e2;color:#dc2626;}
.badge-fuga{background:#dbeafe;color:#1d4ed8;}
.badge-aprob{background:#f0fdf4;color:#16a34a;}
.badge-rech{background:#fee2e2;color:#dc2626;}

/* PANTALLA 2 — detalle máquina */
.maq-header{background:#fff;border-radius:16px;border:1.5px solid #e2e8f0;padding:20px 24px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;box-shadow:0 1px 6px rgba(0,0,0,.05);}
.maq-header-left{display:flex;align-items:center;gap:14px;}
.maq-icon{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,#1e3a8a,#2563eb);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.maq-nombre{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;letter-spacing:1px;color:#0f172a;}
.maq-sub{font-size:12px;color:#64748b;margin-top:2px;}
.maq-codigo{display:inline-flex;padding:2px 10px;background:#eff6ff;border:1px solid #93c5fd;border-radius:20px;font-size:12px;font-weight:700;color:#1e40af;margin-top:4px;}
.tipo-btns{display:flex;gap:12px;flex-wrap:wrap;}
.tipo-btn{padding:12px 28px;border-radius:12px;border:2px solid transparent;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .2s;}
.tipo-btn.alist{background:#eff6ff;border-color:#93c5fd;color:#1e40af;}
.tipo-btn.alist:hover,.tipo-btn.alist.active{background:#dbeafe;border-color:#2563eb;color:#1e3a8a;}
.tipo-btn.mant{background:#fef9c3;border-color:#fcd34d;color:#a16207;}
.tipo-btn.mant:hover,.tipo-btn.mant.active{background:#fef08a;border-color:#ca8a04;color:#78350f;}

.sub-table-wrap{background:#fff;border-radius:16px;border:1.5px solid #e2e8f0;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.05);}
.empty{text-align:center;padding:40px;color:#94a3b8;font-size:14px;}
</style>
</head>
<body>

<header>
  <div class="hd-left">
    <div class="hd-logo">
      <img src="/logo.png" alt="Millar" onerror="this.style.display='none'">
    </div>
    <div>
      <div class="hd-title">Hoja de Vida — <span id="hd-subtitle">Máquina</span></div>
      <div class="hd-date" id="hd-date"></div>
    </div>
  </div>
  <div class="hd-right" id="hd-right">
    <button class="btn-primary" onclick="irDashboard()">📊 Dashboard</button>
    <button class="btn-volver" id="btn-volver" onclick="volverAtras()">← Volver</button>
  </div>
</header>

<main>

  <!-- PANTALLA 1: LISTA DE MÁQUINAS -->
  <div class="screen active" id="screen-lista">
    <div class="table-panel">
      <table>
        <thead>
          <tr>
            <th style="width:130px;">Tipo</th>
            <th style="width:160px;">Código</th>
            <th style="width:130px;">Serial</th>
            <th style="width:130px;">Intervenciones</th>
            <th style="width:130px;">Ver</th>
          </tr>
          <tr id="filter-row-lista">
            <td style="padding:4px 8px;"><input class="filter-input" id="fl-tipo" placeholder="Buscar..." oninput="filtrarLista()"></td>
            <td style="padding:4px 8px;"><input class="filter-input" id="fl-codigo" placeholder="Buscar..." oninput="filtrarLista()"></td>
            <td style="padding:4px 8px;"><input class="filter-input" id="fl-serial" placeholder="Buscar..." oninput="filtrarLista()"></td>
            <td style="padding:4px 8px;"><input class="filter-input" id="fl-count" placeholder="Buscar..." oninput="filtrarLista()"></td>
            <td></td>
          </tr>
        </thead>
        <tbody id="lista-body"></tbody>
      </table>
    </div>
  </div>

  <!-- PANTALLA 2: DASHBOARD GENERAL -->
  <div class="screen" id="screen-dashboard">
    <div class="kpis-row" id="dash-kpis"></div>
    <div class="ranking-card">
      <div class="ranking-title">🏆 Máquinas con más intervenciones</div>
      <div id="dash-ranking"></div>
    </div>
  </div>

  <!-- PANTALLA 3: DETALLE MÁQUINA -->
  <div class="screen" id="screen-detalle">
    <div class="maq-header">
      <div class="maq-header-left">
        <div class="maq-icon">⚙️</div>
        <div>
          <div class="maq-nombre" id="det-nombre">—</div>
          <div class="maq-sub" id="det-serial">—</div>
          <div class="maq-codigo" id="det-codigo">—</div>
        </div>
      </div>
      <div class="tipo-btns">
        <button class="tipo-btn alist active" id="btn-tipo-alist" onclick="switchTipo('alist')">⚙️ Alistamientos</button>
        <button class="tipo-btn mant" id="btn-tipo-mant" onclick="switchTipo('mant')">🔧 Mantenimientos</button>
      </div>
    </div>

    <!-- Tabla Alistamientos -->
    <div id="tabla-alist-wrap" class="sub-table-wrap">
      <table style="width:100%;table-layout:fixed;font-size:12px;border-collapse:collapse;">
        <thead>
          <tr>
            <th style="width:85px;background:#f8fafc;padding:10px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;border-bottom:1.5px solid #e2e8f0;">Fecha</th>
            <th style="width:100px;background:#f8fafc;padding:10px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;border-bottom:1.5px solid #e2e8f0;">Mecánico</th>
            <th style="width:60px;background:#f8fafc;padding:10px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;border-bottom:1.5px solid #e2e8f0;">Módulo</th>
            <th style="width:90px;background:#f8fafc;padding:10px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;border-bottom:1.5px solid #e2e8f0;">Referencia</th>
            <th style="width:80px;background:#f8fafc;padding:10px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;border-bottom:1.5px solid #e2e8f0;">T.Aguja</th>
            <th style="width:65px;background:#f8fafc;padding:10px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;border-bottom:1.5px solid #e2e8f0;">Calibre</th>
            <th style="width:50px;background:#f8fafc;padding:10px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;border-bottom:1.5px solid #e2e8f0;">PPP</th>
            <th style="width:80px;background:#f8fafc;padding:10px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;border-bottom:1.5px solid #e2e8f0;">Guía</th>
            <th style="width:55px;background:#f8fafc;padding:10px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;border-bottom:1.5px solid #e2e8f0;">Ficha</th>
            <th style="width:60px;background:#f8fafc;padding:10px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;border-bottom:1.5px solid #e2e8f0;">Muestra</th>
            <th style="width:85px;background:#f8fafc;padding:10px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;border-bottom:1.5px solid #e2e8f0;">Costura</th>
            <th style="background:#f8fafc;padding:10px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;border-bottom:1.5px solid #e2e8f0;">Observaciones</th>
          </tr>
        </thead>
        <tbody id="det-alist-body"></tbody>
      </table>
    </div>

    <!-- Tabla Mantenimientos -->
    <div id="tabla-mant-wrap" class="sub-table-wrap" style="display:none;">
      <table style="width:100%;table-layout:fixed;font-size:12px;border-collapse:collapse;">
        <thead>
          <tr>
            <th style="width:85px;background:#f8fafc;padding:10px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;border-bottom:1.5px solid #e2e8f0;">Fecha</th>
            <th style="width:90px;background:#f8fafc;padding:10px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;border-bottom:1.5px solid #e2e8f0;">Tipo</th>
            <th style="width:100px;background:#f8fafc;padding:10px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;border-bottom:1.5px solid #e2e8f0;">Mecánico</th>
            <th style="width:60px;background:#f8fafc;padding:10px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;border-bottom:1.5px solid #e2e8f0;">Módulo</th>
            <th style="width:85px;background:#f8fafc;padding:10px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;border-bottom:1.5px solid #e2e8f0;">Guía</th>
            <th style="width:110px;background:#f8fafc;padding:10px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;border-bottom:1.5px solid #e2e8f0;">Repuestos</th>
            <th style="background:#f8fafc;padding:10px 12px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#64748b;border-bottom:1.5px solid #e2e8f0;">Observaciones</th>
          </tr>
        </thead>
        <tbody id="det-mant-body"></tbody>
      </table>
    </div>
  </div>

</main>

<script>
const API = '/alistamiento';
let todosAlist = [], todosMant = [], maquinaria = [];
let listaMaquinas = [];
let maqActual = null;
let pantallaActual = 'lista';

// ── INIT ──────────────────────────────────────────────────────────
async function init() {
  document.getElementById('hd-date').textContent = new Date().toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  await Promise.all([cargarAlist(), cargarMant(), cargarMaquinaria()]);
  construirListaMaquinas();
  renderLista(listaMaquinas);
}

async function cargarAlist() {
  try { const r = await fetch(`${API}/api/alistamientos`); if(r.ok) todosAlist = await r.json(); } catch(e){ console.warn(e); }
}
async function cargarMant() {
  try { const r = await fetch(`${API}/api/mantenimientos`); if(r.ok) todosMant = await r.json(); } catch(e){ console.warn(e); }
}
async function cargarMaquinaria() {
  try { const r = await fetch('/api/maquinaria'); if(r.ok) maquinaria = await r.json(); } catch(e){ console.warn(e); }
}

function getMaqCodigo(serial) {
  if (!serial) return '—';
  const m = maquinaria.find(x => x.serial && x.serial.toLowerCase() === serial.toLowerCase());
  return m ? (m.codigo || m.code || '—') : '—';
}

// ── LISTA DE MÁQUINAS ─────────────────────────────────────────────
function construirListaMaquinas() {
  const map = {};
  [...todosMant, ...todosAlist].forEach(r => {
    const key = (r.serial||'').trim().toUpperCase();
    if (!key) return;
    if (!map[key]) {
      map[key] = {
        tipo:   r.tipoMaquina || '—',
        serial: r.serial || '—',
        codigo: getMaqCodigo(r.serial),
        count:  0
      };
    }
    map[key].count++;
  });
  listaMaquinas = Object.values(map).sort((a,b) => b.count - a.count);
}

function renderLista(rows) {
  const tbody = document.getElementById('lista-body');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="5"><div class="empty">No hay máquinas intervenidas</div></td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(m => `
    <tr>
      <td style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${m.tipo}</td>
      <td style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><code style="font-size:11px;background:#f1f5f9;padding:2px 6px;border-radius:4px;">${m.codigo}</code></td>
      <td style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"><code style="font-size:11px;background:#f1f5f9;padding:2px 6px;border-radius:4px;">${m.serial}</code></td>
      <td style="font-weight:700;color:#2563eb;text-align:center;">${m.count}</td>
      <td><button class="btn-ver" onclick="verDetalle('${m.serial.replace(/'/g,"\\'")}')">👁 Ver intervenciones</button></td>
    </tr>`).join('');
}

function filtrarLista() {
  const qTipo   = document.getElementById('fl-tipo').value.toLowerCase();
  const qCodigo = document.getElementById('fl-codigo').value.toLowerCase();
  const qSerial = document.getElementById('fl-serial').value.toLowerCase();
  const qCount  = document.getElementById('fl-count').value.toLowerCase();
  const rows = listaMaquinas.filter(m =>
    (!qTipo   || m.tipo.toLowerCase().includes(qTipo)) &&
    (!qCodigo || m.codigo.toLowerCase().includes(qCodigo)) &&
    (!qSerial || m.serial.toLowerCase().includes(qSerial)) &&
    (!qCount  || String(m.count).includes(qCount))
  );
  renderLista(rows);
}

// ── NAVEGACIÓN ────────────────────────────────────────────────────
function mostrarPantalla(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  pantallaActual = id;
}

function irDashboard() {
  document.getElementById('hd-subtitle').textContent = 'Dashboard';
  renderDashboard();
  mostrarPantalla('screen-dashboard');
}

function volverAtras() {
  if (pantallaActual === 'screen-dashboard' || pantallaActual === 'screen-detalle') {
    document.getElementById('hd-subtitle').textContent = 'Máquina';
    mostrarPantalla('screen-lista');
  } else {
    history.back();
  }
}

// ── DETALLE MÁQUINA ───────────────────────────────────────────────
function verDetalle(serial) {
  const maq = listaMaquinas.find(m => m.serial === serial);
  if (!maq) return;
  maqActual = maq;

  document.getElementById('det-nombre').textContent  = maq.tipo;
  document.getElementById('det-serial').textContent  = 'Serial: ' + maq.serial;
  document.getElementById('det-codigo').textContent  = maq.codigo;
  document.getElementById('hd-subtitle').textContent = maq.tipo;

  // Cargar datos de esa máquina
  const alist = todosAlist.filter(a => (a.serial||'').toUpperCase() === serial.toUpperCase())
    .sort((a,b) => new Date(b.fecha||'2000') - new Date(a.fecha||'2000'));
  const mant  = todosMant.filter(m => (m.serial||'').toUpperCase() === serial.toUpperCase())
    .sort((a,b) => new Date(b.fecha||'2000') - new Date(a.fecha||'2000'));

  renderDetalleAlist(alist);
  renderDetalleMant(mant);
  switchTipo('alist');
  mostrarPantalla('screen-detalle');
}

function switchTipo(tipo) {
  document.getElementById('tabla-alist-wrap').style.display = tipo === 'alist' ? '' : 'none';
  document.getElementById('tabla-mant-wrap').style.display  = tipo === 'mant'  ? '' : 'none';
  document.getElementById('btn-tipo-alist').classList.toggle('active', tipo === 'alist');
  document.getElementById('btn-tipo-mant').classList.toggle('active', tipo === 'mant');
}

function renderDetalleAlist(rows) {
  const tbody = document.getElementById('det-alist-body');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="12"><div class="empty">Sin alistamientos registrados</div></td></tr>';
    return;
  }
  const TD = 'padding:10px 12px;border-bottom:1px solid #f1f5f9;color:#334155;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;';
  tbody.innerHTML = rows.map(r => {
    const badge = r.pruebaCostura === 'Aprobada'
      ? '<span class="badge badge-aprob">Aprobada</span>'
      : r.pruebaCostura === 'Rechazada'
      ? '<span class="badge badge-rech">Rechazada</span>'
      : (r.pruebaCostura||'—');
    return `<tr>
      <td style="${TD}">${r.fecha||'—'}</td>
      <td style="${TD}">${r.mecanico||'—'}</td>
      <td style="${TD};text-align:center;font-weight:700;">${r.modulo||'—'}</td>
      <td style="${TD}">${r.referencia||'—'}</td>
      <td style="${TD}">${r.tipoAguja||'—'}</td>
      <td style="${TD}">${r.calibreAguja||'—'}</td>
      <td style="${TD}">${r.ppp||'—'}</td>
      <td style="${TD}">${r.numeroGuia||'—'}</td>
      <td style="${TD};text-align:center;">${r.fichaTecnica||'—'}</td>
      <td style="${TD};text-align:center;">${r.muestraFisica||'—'}</td>
      <td style="${TD}">${badge}</td>
      <td style="${TD};color:#64748b;">${r.observaciones||'—'}</td>
    </tr>`;
  }).join('');
}

function renderDetalleMant(rows) {
  const tbody = document.getElementById('det-mant-body');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="7"><div class="empty">Sin mantenimientos registrados</div></td></tr>';
    return;
  }
  const TD = 'padding:10px 12px;border-bottom:1px solid #f1f5f9;color:#334155;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;';
  tbody.innerHTML = rows.map(r => {
    const tipo = r.tipoMantenimiento||'';
    const badge = tipo === 'Preventivo'
      ? '<span class="badge badge-prev">Preventivo</span>'
      : tipo === 'Correctivo'
      ? '<span class="badge badge-corr">Correctivo</span>'
      : '<span class="badge badge-fuga">Fugas</span>';
    return `<tr>
      <td style="${TD}">${r.fecha||'—'}</td>
      <td style="${TD}">${badge}</td>
      <td style="${TD}">${r.mecanico||'—'}</td>
      <td style="${TD};text-align:center;font-weight:700;">${r.modulo||'—'}</td>
      <td style="${TD}">${r.numeroGuia||'—'}</td>
      <td style="${TD}">${r.repuestos||'—'}</td>
      <td style="${TD};color:#64748b;">${r.observaciones||'—'}</td>
    </tr>`;
  }).join('');
}

// ── DASHBOARD GENERAL ─────────────────────────────────────────────
function renderDashboard() {
  const totalMant  = todosMant.length;
  const totalAlist = todosAlist.length;
  const prev  = todosMant.filter(m => m.tipoMantenimiento === 'Preventivo').length;
  const corr  = todosMant.filter(m => m.tipoMantenimiento === 'Correctivo').length;
  const fuga  = todosMant.filter(m => m.tipoMantenimiento === 'Mantenimiento de Fugas' || m.tipoMantenimiento === 'Fugas').length;
  const aprob = todosAlist.filter(a => a.pruebaCostura === 'Aprobada').length;
  const rech  = todosAlist.filter(a => a.pruebaCostura === 'Rechazada').length;

  const kpis = [
    { val: totalMant+totalAlist, lbl:'Total intervenciones', color:'#1e40af', bg:'#eff6ff' },
    { val: totalMant,  lbl:'Mantenimientos', color:'#1e40af', bg:'#dbeafe' },
    { val: totalAlist, lbl:'Alistamientos',  color:'#16a34a', bg:'#f0fdf4' },
    { val: prev,  lbl:'Preventivos', color:'#a16207', bg:'#fef9c3' },
    { val: corr,  lbl:'Correctivos', color:'#dc2626', bg:'#fee2e2' },
    { val: fuga,  lbl:'Fugas',       color:'#1d4ed8', bg:'#dbeafe' },
    { val: aprob, lbl:'Aprobados',   color:'#16a34a', bg:'#f0fdf4' },
    { val: rech,  lbl:'Rechazados',  color:'#dc2626', bg:'#fee2e2' },
  ];

  document.getElementById('dash-kpis').innerHTML = kpis.map(k => `
    <div class="kpi" style="border-color:${k.color}22;background:${k.bg};">
      <div class="kpi-val" style="color:${k.color};">${k.val}</div>
      <div class="kpi-lbl">${k.lbl}</div>
    </div>`).join('');

  // Ranking
  const ranking = listaMaquinas.slice(0, 10);
  const maxVal  = ranking[0]?.count || 1;
  document.getElementById('dash-ranking').innerHTML = ranking.map((m, i) => {
    const pct = Math.round((m.count / maxVal) * 100);
    return `<div class="rank-row">
      <div class="rank-pos">${i+1}</div>
      <div class="rank-bar-wrap">
        <div class="rank-nombre">${m.tipo} <span style="color:#94a3b8;font-weight:400;">· ${m.serial}</span></div>
        <div class="rank-bar"><div class="rank-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="rank-count">${m.count}</div>
    </div>`;
  }).join('');
}

init();
</script>
