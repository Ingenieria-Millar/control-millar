<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>/* millar-auth: adjunta token de sesión a fetch (transparente si no hay token) */
(function(){function T(){try{var s=JSON.parse(localStorage.getItem('cm_session')||'{}');return s&&s.token||'';}catch(e){return '';}}
var F=window.fetch;window.fetch=function(u,o){o=o||{};var t=T();if(t){var h=new Headers(o.headers||{});if(!h.has('Authorization'))h.set('Authorization','Bearer '+t);o.headers=h;}return F.call(this,u,o);};})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registros Contador Producción — Admin | Millar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Nunito:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f1f5f9;font-family:'Nunito',sans-serif;color:#0f172a;min-height:100vh;}
input,select,button{font-family:inherit;}
header{background:#fff;border-bottom:1px solid #e2e8f0;box-shadow:0 1px 6px rgba(0,0,0,.07);
  padding:0 clamp(12px,2.5vw,24px);min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  position:sticky;top:0;z-index:10;flex-wrap:wrap;row-gap:8px;}
.hd-title{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#0f172a;}
.hd-title span{color:#2563eb;}
.hd-back{padding:8px 16px;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;color:#334155;
  font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;cursor:pointer;}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px;}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px;}
.filters input,.filters select{padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13.5px;}
.filters button{padding:9px 16px;border-radius:8px;border:none;background:#2563eb;color:#fff;font-weight:700;cursor:pointer;font-size:13px;}
.denied{max-width:440px;margin:80px auto;text-align:center;background:#fff;border:1.5px solid #fecaca;border-radius:16px;padding:36px 24px;}
.denied .ic{font-size:40px;margin-bottom:10px;}
table{width:100%;border-collapse:collapse;background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;overflow:hidden;}
th{background:#f8fafc;font-family:'Barlow Condensed',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;color:#64748b;padding:10px 12px;text-align:left;border-bottom:1.5px solid #e2e8f0;}
td{padding:9px 12px;font-size:13px;border-bottom:1px solid #f1f5f9;}
tr:last-child td{border-bottom:none;}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;}
.tag.produccion{background:#dbeafe;color:#1e40af;}
.tag.calidad{background:#fee2e2;color:#b91c1c;}
.qty-edit{width:60px;padding:5px 7px;border:1.5px solid #e2e8f0;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-weight:700;}
.actions{display:flex;gap:6px;}
.btn-sm{padding:6px 12px;border-radius:7px;border:1.5px solid #e2e8f0;background:#fff;font-size:12px;font-weight:700;cursor:pointer;}
.btn-sm.save{background:#16a34a;color:#fff;border-color:#16a34a;}
.btn-sm.del{background:#fff;color:#dc2626;border-color:#fecaca;}
.empty{text-align:center;color:#94a3b8;padding:40px;}
.note{font-size:12px;color:#64748b;margin-bottom:14px;}
</style>
</head>
<body>

<header>
  <div class="hd-title">REGISTROS <span>CONTADOR PRODUCCIÓN</span></div>
  <button class="hd-back" onclick="location.href='/'">← Volver</button>
</header>

<main id="app">
  <div class="empty">Verificando permisos…</div>
</main>

<script>
async function verificarAdmin(){
  try{
    const raw = localStorage.getItem('cm_session');
    const s = raw ? JSON.parse(raw) : null;
    if(!s || !s.token) return renderDenied('No hay una sesión activa. Inicia sesión con tu usuario.');
    const r = await fetch('/api/me');
    if(!r.ok) return renderDenied('Tu sesión expiró. Inicia sesión de nuevo.');
    const d = await r.json();
    if(d.rol !== 'programador') return renderDenied('Esta pantalla es solo para el perfil Programador/Admin.');
    renderApp();
  }catch(e){ renderDenied('No se pudo verificar tu sesión.'); }
}
function renderDenied(msg){
  document.getElementById('app').innerHTML = `<div class="denied"><div class="ic">🔒</div>
    <div style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;letter-spacing:1px;margin-bottom:8px;">Acceso restringido</div>
    <div style="font-size:13.5px;color:#64748b;">${msg}</div></div>`;
}

let registros=[], editId=null;
function renderApp(){
  document.getElementById('app').innerHTML = `
    <div class="note">Solo el perfil Programador/Admin puede corregir cantidades o eliminar registros. Los operarios únicamente pueden crear registros nuevos desde Contador Producción.</div>
    <div class="filters">
      <input id="f-modulo" placeholder="Módulo (ej. M07)">
      <input id="f-fecha" type="date">
      <button onclick="cargar()">Buscar</button>
    </div>
    <table>
      <thead><tr><th>Fecha</th><th>Hora</th><th>Módulo</th><th>Operario</th><th>OP</th><th>Tipo</th><th>Cantidad</th><th>Acciones</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  `;
  const hoy=new Date().toISOString().split('T')[0];
  document.getElementById('f-fecha').value=hoy;
  cargar();
}
async function cargar(){
  const modulo=document.getElementById('f-modulo').value.trim();
  const fecha=document.getElementById('f-fecha').value;
  const params=new URLSearchParams();
  if(modulo) params.set('modulo',modulo);
  if(fecha) params.set('fecha',fecha);
  try{
    const r=await fetch('/api/contador-produccion/registros?'+params.toString());
    const d=await r.json();
    registros=(d.registros||[]).sort((a,b)=> (b.timestamp||'').localeCompare(a.timestamp||''));
    render();
  }catch(e){ document.getElementById('tbody').innerHTML='<tr><td colspan="8" class="empty">Error al cargar</td></tr>'; }
}
function render(){
  const tbody=document.getElementById('tbody');
  if(!registros.length){ tbody.innerHTML='<tr><td colspan="8" class="empty">Sin registros para este filtro</td></tr>'; return; }
  tbody.innerHTML = registros.map(r=>{
    const editando = editId===r.id;
    return `<tr>
      <td>${r.fecha}</td><td>${r.hora}</td><td>${r.modulo}</td><td>${r.operario}</td>
      <td>${r.op}${r.ref?' · '+r.ref:''}</td>
      <td><span class="tag ${r.tipo}">${r.tipo==='produccion'?'Producción':'Mala calidad'}</span></td>
      <td>${editando ? `<input class="qty-edit" id="qty-${r.id}" type="number" min="1" value="${r.cantidad}">` : r.cantidad}</td>
      <td class="actions">
        ${editando ? `
          <button class="btn-sm save" onclick="guardarEdicion('${r.id}')">Guardar</button>
          <button class="btn-sm" onclick="editId=null;render()">Cancelar</button>
        ` : `
          <button class="btn-sm" onclick="editId='${r.id}';render()">Editar</button>
          <button class="btn-sm del" onclick="eliminarRegistro('${r.id}')">Eliminar</button>
        `}
      </td>
    </tr>`;
  }).join('');
}
async function guardarEdicion(id){
  const cantidad=Number(document.getElementById('qty-'+id).value);
  if(!cantidad || cantidad<=0 || !Number.isInteger(cantidad)){ alert('Cantidad inválida'); return; }
  try{
    const r=await fetch('/api/contador-produccion/registro/'+id, {
      method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({cantidad})
    });
    const d=await r.json();
    if(!r.ok){ alert(d.error||'No se pudo guardar'); return; }
    editId=null; cargar();
  }catch(e){ alert('Error de conexión'); }
}
async function eliminarRegistro(id){
  if(!confirm('¿Eliminar este registro? Esta acción no se puede deshacer.')) return;
  try{
    const r=await fetch('/api/contador-produccion/registro/'+id, { method:'DELETE' });
    const d=await r.json();
    if(!r.ok){ alert(d.error||'No se pudo eliminar'); return; }
    cargar();
  }catch(e){ alert('Error de conexión'); }
}

verificarAdmin();
</script>
</body>
</html>
